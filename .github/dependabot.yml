version: 2

updates:
  # Reusable workflows in .github/workflows, and the actions they use
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions

  # The hash lock of the Ansible tools the self-test fixture installs. The `uv`
  # ecosystem recompiles a `uv pip compile` lock from requirements.in; `pip`
  # would run pip-compile, which cannot write a universal lock.
  - package-ecosystem: uv
    directory: /.github/fixtures/ansible-gated-apply/ansible
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
