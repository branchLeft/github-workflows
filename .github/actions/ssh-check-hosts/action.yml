name: Check every host in check mode
description: >-
  Ask each host, through the restricted SSH route, what an apply of one commit
  would change, judge the answers, scan the diff for secrets and write the
  result to the job summary. It holds the check key and never applies.

# One home for the host check. The plan job of ansible-gated-apply.yml and the
# nightly job of ansible-drift-check.yml both call it, so the host list is
# validated, the key is used and the answers are judged in one place. The
# reasons and the failure modes are in the README ("ansible-gated-apply.yml",
# "ansible-drift-check.yml").
#
# A caller reaches it by a path in its own workspace, because a reusable
# workflow cannot name an action of its own repository: it checks this
# repository out at the commit it was called at, then runs this file from there.

inputs:
  hosts:
    description: >-
      The hosts to check, one user@host per line. Pass it from a secret so the
      job log masks the names.
    required: true
  known-hosts:
    description: The known_hosts lines of the hosts. Pass it from a secret. Empty only in a dry run.
    required: false
    default: ''
  check-key:
    description: >-
      The private key of the check route, which the host restricts to the forced
      command in check mode. Pass it from a secret. Empty only in a dry run.
    required: false
    default: ''
  jump-host:
    description: >-
      Empty (the default) reaches every host directly. A user@host, in the form
      the hosts input takes, reaches every host through that one host (ssh
      ProxyJump) and needs jump-key too. Pass it from a secret so the job log
      masks the name. Its host-key line goes in known-hosts, which already holds
      one line per host.
    required: false
    default: ''
  jump-key:
    description: >-
      The private key for the jump host only, never the check key or the apply
      key. The jump host restricts it to opening a connection to port 22 of the
      listed hosts. Pass it from a secret. A jump needs jump-host and jump-key
      both, or neither.
    required: false
    default: ''
  push-hosts:
    description: >-
      Empty (the default) puts no host on the push route. Otherwise a subset of
      hosts, one user@host per line, that never open a connection themselves:
      the runner connects to each, through the jump host, and streams a git
      bundle of the checked-out commit on standard input, with the command
      '<mode> <commit> <push-playbook>'. Every line must also be in hosts.
      Needs push-playbook, jump-host and jump-key, a checkout of the caller's
      repository at sha with its whole history, and a public repository. Pass it
      from a secret so the job log masks the names.
    required: false
    default: ''
  push-playbook:
    description: >-
      With push-hosts, the playbook the receiver is asked to run: a relative
      path of letters, digits, dot, underscore, dash and slash, with no '..'.
      Ignored when push-hosts is empty.
    required: false
    default: ''
  push-dry-run-stub:
    description: >-
      With dry-run and push-hosts, the executable, relative to working-directory,
      that stands in for the receiver. It receives the destination, the mode, the
      commit and the playbook, and the bundle on standard input.
    required: false
    default: ''
  push-repo-private:
    description: >-
      With push-hosts, the value of github.event.repository.private, passed as it
      is. A bundle carries the whole history of the repository to the host, so
      only the exact value false is accepted: an empty or any other value refuses.
    required: false
    default: ''
  sha:
    description: The commit to ask about, 40 lowercase hex digits.
    required: true
  dry-run:
    description: 'true replaces the SSH call with dry-run-stub; false (the default) calls the hosts.'
    required: false
    default: 'false'
  dry-run-stub:
    description: With dry-run, the executable, relative to working-directory, that stands in for a host.
    required: false
    default: ''
  working-directory:
    description: The directory, relative to the workspace root, that dry-run-stub is relative to.
    required: false
    default: '.'
  host-timeout:
    description: One host call is stopped after this many minutes.
    required: false
    default: '65'
  total-timeout:
    description: >-
      Empty (the default) puts no bound on the hosts together. A whole number of
      minutes is the time all the host calls share: each call is stopped at the
      smaller of host-timeout and what is left, and a host reached after the
      time is spent is not asked and is judged as no-answer. The caller's job
      bound must sit above it.
    required: false
    default: ''
  environment:
    description: >-
      The deployment environment the plan's apply would wait on. It appears in
      the plan wording only and is not read when fail-on-changes is true.
    required: false
    default: ''
  fail-on-changes:
    description: >-
      false (the default) is the plan: a host that would change is a result, the
      step succeeds and has-changes says so. true is the drift check: any host
      that would change, or any answer that is not a clean one, fails the step.
    required: false
    default: 'false'

outputs:
  has-changes:
    description: >-
      false only when every host answered clean for this commit; true for every
      other outcome.
    value: ${{ steps.report.outputs.has_changes }}
  hosts-digest:
    description: The SHA-256 of the validated host list, so a later job can prove it uses the same hosts.
    value: ${{ steps.validate.outputs.hosts_digest }}
  push-hosts-digest:
    description: >-
      The SHA-256 of the validated push list, so a later job can prove it uses
      the same push hosts. Empty when push-hosts is empty.
    value: ${{ steps.validate.outputs.push_hosts_digest }}
  outcome:
    description: >-
      ok, drift, refused, unreachable, no-answer, failed, withheld, or mixed when
      more than one of those occurred. Empty if the step stopped before it could
      judge.
    value: ${{ steps.report.outputs.outcome }}
  detail:
    description: >-
      The outcome in words with counts, and no host name. Empty if the step
      stopped before it could judge.
    value: ${{ steps.report.outputs.detail }}

runs:
  using: composite
  steps:
    - name: Validate the host list and the inputs
      id: validate
      shell: bash
      env:
        HOSTS: ${{ inputs.hosts }}
        SHA: ${{ inputs.sha }}
        DRY_RUN: ${{ inputs.dry-run }}
        DRY_RUN_STUB: ${{ inputs.dry-run-stub }}
        FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
        HOST_TIMEOUT_MINUTES: ${{ inputs.host-timeout }}
        TOTAL_TIMEOUT_MINUTES: ${{ inputs.total-timeout }}
        JUMP_HOST: ${{ inputs.jump-host }}
        JUMP_KEY: ${{ inputs.jump-key }}
        PUSH_HOSTS: ${{ inputs.push-hosts }}
        PUSH_PLAYBOOK: ${{ inputs.push-playbook }}
        PUSH_DRY_RUN_STUB: ${{ inputs.push-dry-run-stub }}
        PUSH_REPO_PRIVATE: ${{ inputs.push-repo-private }}
      run: |
        set -euo pipefail
        fail() {
          echo "::error::$1"
          exit 1
        }
        sha_re='^[0-9a-f]{40}$'
        minutes_re='^[1-9][0-9]{0,3}$'
        destination_pattern='^[a-z_][a-z0-9_-]{0,31}@[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'
        [[ "$SHA" =~ $sha_re ]] || fail "The commit is not 40 lowercase hex digits."
        case "$DRY_RUN" in true | false) ;; *) fail "dry-run must be true or false." ;; esac
        case "$FAIL_ON_CHANGES" in true | false) ;; *) fail "fail-on-changes must be true or false." ;; esac
        [[ "$HOST_TIMEOUT_MINUTES" =~ $minutes_re ]] || fail "host-timeout must be a whole number of minutes, at least 1."
        if [ -n "$TOTAL_TIMEOUT_MINUTES" ]; then
          [[ "$TOTAL_TIMEOUT_MINUTES" =~ $minutes_re ]] || fail "total-timeout must be empty or a whole number of minutes, at least 1."
        fi
        if [ "$DRY_RUN" = true ]; then
          [ -n "$DRY_RUN_STUB" ] || fail "dry-run needs dry-run-stub."
        fi
        # A jump needs a host and a key, or neither. The host goes into an ssh
        # config file, so it is held to the form of a hosts line and to one line:
        # grep judges each line alone and would pass a good line with more after it.
        if [ -n "$JUMP_HOST" ] || [ -n "$JUMP_KEY" ]; then
          [ -n "$JUMP_HOST" ] || fail "jump-key is set but jump-host is empty: a jump needs both or neither."
          [ -n "$JUMP_KEY" ] || fail "jump-host is set but jump-key is empty: a jump needs both or neither."
          case "$JUMP_HOST" in *$'\n'*) fail "jump-host is not of the form user@host." ;; esac
          printf '%s' "$JUMP_HOST" | grep -Eq "$destination_pattern" \
            || fail "jump-host is not of the form user@host."
        fi
        # One validated destination per line. The apply job rebuilds the list
        # from the same secret and must find the same digest, so it never
        # reaches a host that was not planned. The names are not a job output
        # because an output carrying a secret is dropped.
        list=""
        count=0
        while IFS= read -r dest; do
          [ -n "$dest" ] || continue
          printf '%s' "$dest" | grep -Eq "$destination_pattern" \
            || fail "A hosts line is not of the form user@host."
          case " $list " in *" $dest "*) fail "A host is listed twice." ;; esac
          list="${list:+$list }$dest"
          count=$((count + 1))
        done <<< "$HOSTS"
        [ "$count" -ge 1 ] || fail "The ssh_hosts secret lists no host, so there is nothing to plan."
        [ "$count" -le 50 ] || fail "The ssh_hosts secret lists more than 50 hosts."
        digest=$(printf '%s' "$list" | shasum -a 256 | cut -d ' ' -f 1)
        echo "hosts_digest=$digest" >> "$GITHUB_OUTPUT"
        # The push route is off unless push-hosts is set, and then nothing else
        # about it is read: push-playbook set with no push list is ignored. A push
        # host is one of the hosts above, so the hosts list, its digest and the
        # known_hosts lines are the ones every caller already has. The apply job
        # rebuilds the push list from the same secret and must find the same
        # digest, so it never pushes to a host that was not planned. A push
        # sends the whole history of the checked-out repository to the host, so
        # it is refused unless the repository is public: only the exact value
        # false passes, and an empty value (a payload without the field) refuses.
        push_digest=""
        push_count=0
        if [ -n "$PUSH_HOSTS" ]; then
          playbook_re='^[A-Za-z0-9_][A-Za-z0-9_./-]*$'
          [[ "$PUSH_PLAYBOOK" =~ $playbook_re ]] || fail "push-playbook must be a relative path of letters, digits, dot, underscore, dash and slash."
          case "$PUSH_PLAYBOOK" in *..*) fail "push-playbook must not contain '..'." ;; esac
          [ "$PUSH_REPO_PRIVATE" = false ] || fail "Pushing refuses unless the repository is public: a bundle carries its whole history to the host."
          { [ -n "$JUMP_HOST" ] && [ -n "$JUMP_KEY" ]; } || fail "push-hosts needs jump-host and jump-key: a pushed host is reached only through the jump host."
          if [ "$DRY_RUN" = true ]; then
            [ -n "$PUSH_DRY_RUN_STUB" ] || fail "dry-run with push-hosts needs push-dry-run-stub."
          fi
          push_list=""
          while IFS= read -r dest; do
            [ -n "$dest" ] || continue
            # A push host must equal a line of the hosts list, which was held to
            # the form of a hosts line above, so no pattern is needed here and a
            # line with a space in it matches nothing.
            grep -qxF -- "$dest" <<< "$HOSTS" || fail "A push host is not in the hosts list."
            case " $push_list " in *" $dest "*) fail "A push host is listed twice." ;; esac
            push_list="${push_list:+$push_list }$dest"
            push_count=$((push_count + 1))
          done <<< "$PUSH_HOSTS"
          [ "$push_count" -ge 1 ] || fail "push-hosts lists no host."
          push_digest=$(printf '%s' "$push_list" | shasum -a 256 | cut -d ' ' -f 1)
        fi
        echo "push_hosts_digest=$push_digest" >> "$GITHUB_OUTPUT"
        echo "Checking commit $SHA on $count host(s)."
        echo "$push_count of them by push."

    - name: Check every host in check mode
      id: check
      shell: bash
      env:
        HOSTS: ${{ inputs.hosts }}
        SHA: ${{ inputs.sha }}
        DRY_RUN: ${{ inputs.dry-run }}
        DRY_RUN_STUB: ${{ inputs.dry-run-stub }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        HOST_TIMEOUT_MINUTES: ${{ inputs.host-timeout }}
        TOTAL_TIMEOUT_MINUTES: ${{ inputs.total-timeout }}
        SSH_KEY: ${{ inputs.check-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        JUMP_HOST: ${{ inputs.jump-host }}
        JUMP_KEY: ${{ inputs.jump-key }}
        PUSH_HOSTS: ${{ inputs.push-hosts }}
        PUSH_PLAYBOOK: ${{ inputs.push-playbook }}
        PUSH_DRY_RUN_STUB: ${{ inputs.push-dry-run-stub }}
      run: |
        set -euo pipefail
        fail() {
          echo "::error::$1"
          exit 1
        }
        plan_dir="$RUNNER_TEMP/ansible-plan"
        mkdir "$plan_dir"
        # The key copies go on every way out of the step, a failure included.
        trap 'rm -f "$plan_dir/id" "$plan_dir/known_hosts"' EXIT
        ssh_args=()
        if [ "$DRY_RUN" = true ]; then
          stub="$GITHUB_WORKSPACE/$WORKING_DIRECTORY/$DRY_RUN_STUB"
          [ -x "$stub" ] || fail "dry-run-stub is not an executable file."
        else
          [ -n "$SSH_KEY" ] || fail "The ssh_check_key secret is empty."
          [ -n "$KNOWN_HOSTS" ] || fail "The ssh_known_hosts secret is empty."
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$plan_dir/id" && printf '%s\n' "$KNOWN_HOSTS" > "$plan_dir/known_hosts")
          # The remote command is the commit and nothing else. The key's forced
          # command on the host fixes the mode, so this caller cannot ask for an
          # apply.
          ssh_args=(-T -i "$plan_dir/id" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$plan_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30
            -o ForwardAgent=no -o ClearAllForwardings=yes)
          if [ -n "$JUMP_HOST" ]; then
            # ssh gives a jump hop none of the options on the command line, so the
            # hop is a stanza of its own with its own key and strict options. The
            # alias holds an underscore, which no validated host name can, so no
            # target can select the stanza. User and host were validated as one
            # line of the hosts form before they are written here. The trap is set
            # again, with the jump files, before either file exists.
            trap 'rm -f "$plan_dir/id" "$plan_dir/known_hosts" "$plan_dir/jump_id" "$plan_dir/jump_config"' EXIT
            (
              umask 077
              printf '%s\n' "$JUMP_KEY" > "$plan_dir/jump_id"
              {
                printf 'Host jump_hop\n'
                printf '  HostName %s\n' "${JUMP_HOST#*@}"
                printf '  User %s\n' "${JUMP_HOST%%@*}"
                printf '  IdentityFile %s\n' "$plan_dir/jump_id"
                printf '  IdentitiesOnly yes\n'
                printf '  BatchMode yes\n'
                printf '  StrictHostKeyChecking yes\n'
                printf '  UserKnownHostsFile %s\n' "$plan_dir/known_hosts"
                printf '  GlobalKnownHostsFile /dev/null\n'
                printf '  ConnectTimeout 30\n'
                printf '  ServerAliveInterval 30\n'
                printf '  ForwardAgent no\n'
                printf '  ClearAllForwardings yes\n'
              } > "$plan_dir/jump_config"
            )
            ssh_args+=(-F "$plan_dir/jump_config" -o ProxyJump=jump_hop)
          fi
        fi
        # The push route. A host on the push list never opens a connection, so the
        # runner connects to it and sends what a pull would have fetched: a git
        # bundle of the checked-out commit, on standard input, with the command
        # '<mode> <commit> <playbook>'. The bundle is made once, here, before any
        # host is asked, and each call reads it from the start. It holds the whole
        # history of a public repository, so nothing in it is secret. No fetch or
        # pull command is ever sent to a host.
        push_bundle=""
        push_stub=""
        if [ -n "$PUSH_HOSTS" ]; then
          # --- bundle begin (this text is the same in ssh-check-hosts and in ansible-gated-apply.yml; a test holds the two equal)
          make_bundle() {
            local file="$1" sha="$2" head
            [ "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository)" = false ] \
              || fail "The checkout of the repository is shallow, so its bundle would not carry the history the host needs."
            head=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD) || fail "The checkout of the repository could not be read."
            [ "$head" = "$sha" ] || fail "The checkout of the repository is not at the commit being delivered."
            git -C "$GITHUB_WORKSPACE" bundle create "$file" HEAD > /dev/null 2>&1 || fail "The bundle of the commit could not be made."
          }
          # --- bundle end
          push_bundle="$plan_dir/push.bundle"
          make_bundle "$push_bundle" "$SHA"
          if [ "$DRY_RUN" = true ]; then
            push_stub="$GITHUB_WORKSPACE/$WORKING_DIRECTORY/$PUSH_DRY_RUN_STUB"
            [ -x "$push_stub" ] || fail "push-dry-run-stub is not an executable file."
          fi
        fi
        # Every pull call takes its input from /dev/null. The loop reads the host
        # list from its own standard input, and a call that reads standard input
        # (ssh does) would swallow the hosts after the first. A push call reads
        # the bundle from its own file, so it takes nothing from the loop either.
        i=0
        started=$(date +%s)
        while IFS= read -r dest; do
          [ -n "$dest" ] || continue
          i=$((i + 1))
          n=$(printf '%02d' "$i")
          printf '%s\n' "$dest" > "$plan_dir/$n.dest"
          route=pull
          if [ -n "$PUSH_HOSTS" ] && grep -qxF -- "$dest" <<< "$PUSH_HOSTS"; then
            route=push
          fi
          printf '%s\n' "$route" > "$plan_dir/$n.route"
          rc=0
          # The hosts are asked one after another. With a total time, a call gets
          # the smaller of its own limit and what is left of the total, so the
          # last host is judged before the caller's job bound ends the job.
          limit=$((HOST_TIMEOUT_MINUTES * 60))
          if [ -n "$TOTAL_TIMEOUT_MINUTES" ]; then
            left=$((started + TOTAL_TIMEOUT_MINUTES * 60 - $(date +%s)))
            if [ "$left" -lt "$limit" ]; then
              limit="$left"
            fi
          fi
          if [ "$limit" -le 0 ]; then
            : > "$plan_dir/$n.out"
            : > "$plan_dir/$n.err"
            : > "$plan_dir/$n.skipped"
            rc=124
          elif [ "$route" = push ] && [ "$DRY_RUN" = true ]; then
            "$push_stub" "$dest" check "$SHA" "$PUSH_PLAYBOOK" < "$push_bundle" > "$plan_dir/$n.out" 2> "$plan_dir/$n.err" || rc=$?
          elif [ "$route" = push ]; then
            timeout "${limit}s" ssh "${ssh_args[@]}" -- "$dest" "check $SHA $PUSH_PLAYBOOK" < "$push_bundle" > "$plan_dir/$n.out" 2> "$plan_dir/$n.err" || rc=$?
          elif [ "$DRY_RUN" = true ]; then
            "$stub" "$dest" "$SHA" < /dev/null > "$plan_dir/$n.out" 2> "$plan_dir/$n.err" || rc=$?
          else
            timeout "${limit}s" ssh "${ssh_args[@]}" -- "$dest" "$SHA" < /dev/null > "$plan_dir/$n.out" 2> "$plan_dir/$n.err" || rc=$?
          fi
          printf '%s\n' "$rc" > "$plan_dir/$n.rc"
        done <<< "$HOSTS"
        echo "Asked $i host(s); the answers are judged in the next step."

    # The output of a host is held in files and never printed to the log. It is
    # judged first, scanned for a secret, and only then written to the job
    # summary. A host that failed, a diff that is too large to show whole and a
    # diff that matches a secret pattern each fail the step, so no approval is
    # asked for a plan the approver cannot read in full. With fail-on-changes a
    # host that would change fails the step too, and the outcome names the kind.
    - name: Judge the answers, scan the diff and write the result
      id: report
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
        ENVIRONMENT: ${{ inputs.environment }}
        DRY_RUN: ${{ inputs.dry-run }}
        FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
        SSH_KEY: ${{ inputs.check-key }}
        JUMP_HOST: ${{ inputs.jump-host }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        plan_dir="$RUNNER_TEMP/ansible-plan"
        echo "has_changes=true" >> "$GITHUB_OUTPUT"
        per_host_cap=300000
        total_cap=900000

        # A pattern is "name|extended regular expression". The list is a
        # backstop: the control is no_log and diff: false on the task (ANS-16).
        patterns=(
          'private-key|-----BEGIN [A-Z0-9 ]*PRIVATE KEY'
          'aws-access-key|(AKIA|ASIA)[0-9A-Z]{16}'
          'github-token|(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,})'
          'slack-token|xox[abprs]-[A-Za-z0-9-]{10,}'
          'payment-key|sk_(live|test)_[0-9A-Za-z]{20,}'
          'jwt|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.'
          'credential-assignment|(passw(or)?d|passphrase|secret|token|api[_-]?key|private[_-]?key|credential)[A-Za-z0-9_.-]*"?[[:space:]]*[:=][[:space:]]*"?[^[:space:]"]{4,}'
        )
        # Key material is copied to this file so a diff that quotes it is caught.
        # It is created private, and removed on every way out of the step.
        keylines="$plan_dir/keylines"
        trap 'rm -f "$keylines"' EXIT
        (umask 077 && : > "$keylines")
        if [ -n "$SSH_KEY" ]; then
          printf '%s\n' "$SSH_KEY" | awk 'length($0) >= 16 && $0 !~ /^-----/' > "$keylines"
        fi

        summary="$plan_dir/summary.md"
        details="$plan_dir/details.md"
        : > "$details"
        rows="$plan_dir/rows.md"
        : > "$rows"
        kinds="$plan_dir/kinds"
        : > "$kinds"
        total=0
        clean=0
        changed=0
        failed=0
        total_bytes=0

        for destfile in "$plan_dir"/*.dest; do
          base="${destfile%.dest}"
          n="${base##*/}"
          total=$((total + 1))
          dest=$(cat "$destfile")
          hostpart="${dest#*@}"
          rc=$(cat "$base.rc")
          verdict="failed"
          kind="no-answer"
          note=""

          line_count=$(wc -l < "$base.out" | tr -d ' ')
          line=$(tr -d '\r' < "$base.out" | head -n 1)
          # Each host is judged by its route, and only by the one line its route
          # speaks. A host that was pulled from answers as the pull trigger, a
          # host that was pushed to answers as the push receiver, and the other
          # host's line is no answer. The two lines carry the same fields. The
          # route is written by the step before this one; an absent file means
          # pull, and any other value matches neither line.
          route=pull
          if [ -e "$base.route" ]; then
            route=$(cat "$base.route")
          fi
          re='^pull-trigger verdict=([a-z-]+) exit=([0-9]+) reason=([a-z-]+) mode=check commit=([0-9a-f]{40}) playbook=[A-Za-z0-9_./-]+ changed=([0-9]+|-)$'
          push_re='^push-receiver verdict=([a-z-]+) exit=([0-9]+) reason=([a-z-]+) mode=(check|apply) commit=([0-9a-f]{40}) playbook=[A-Za-z0-9_./-]+ changed=([0-9]+)$'
          matched=no
          if [ "$line_count" = 1 ]; then
            if [ "$route" = push ]; then
              if [[ "$line" =~ $push_re ]] && [ "${BASH_REMATCH[4]}" = check ]; then
                matched=yes
                f_verdict="${BASH_REMATCH[1]}"
                f_exit="${BASH_REMATCH[2]}"
                f_reason="${BASH_REMATCH[3]}"
                f_commit="${BASH_REMATCH[5]}"
                f_changed="${BASH_REMATCH[6]}"
              fi
            elif [ "$route" = pull ]; then
              if [[ "$line" =~ $re ]]; then
                matched=yes
                f_verdict="${BASH_REMATCH[1]}"
                f_exit="${BASH_REMATCH[2]}"
                f_reason="${BASH_REMATCH[3]}"
                f_commit="${BASH_REMATCH[4]}"
                f_changed="${BASH_REMATCH[5]}"
              fi
            fi
          fi
          if [ -e "$base.skipped" ]; then
            note="not asked: the time given to the check was spent before this host"
          elif [ "$rc" = 255 ]; then
            note="the SSH connection failed (exit 255)"
            kind="unreachable"
          elif [ "$matched" != yes ]; then
            note="the host did not answer with one summary line (exit $rc)"
          else
            if [ "$f_commit" != "$SHA" ] || [ "$f_exit" != "$rc" ]; then
              note="the summary line names another commit or exit status (exit $rc)"
            elif [ "$rc" = 0 ] && [ "$f_verdict" = unchanged ] && [ "$f_changed" = 0 ]; then
              verdict="clean"
              kind="ok"
            elif [ "$rc" = 11 ] && [ "$f_verdict" = would-change ] && [ "$f_changed" != - ]; then
              verdict="changes"
              kind="drift"
            else
              note="verdict $f_verdict, reason $f_reason, exit $rc"
              kind="failed"
              if [ "$rc" = 21 ] && [ "$f_verdict" = busy ]; then
                kind="refused: busy"
              elif [ "$rc" = 20 ] && [ "$f_verdict" = refused ]; then
                case "$f_reason" in
                  bad-request | not-on-main | rollback | unsigned | bad-signature | signer-not-allowed | playbook-not-allowed)
                    kind="refused: $f_reason"
                    ;;
                  *)
                    kind="refused: other"
                    ;;
                esac
              fi
            fi
          fi

          # The diff: control characters removed, the host name and the jump host replaced.
          cleaned="$base.clean"
          if [ "$rc" = 255 ]; then
            : > "$cleaned"
          else
            tr -d '\000-\010\013\014\016-\037\177' < "$base.err" \
              | awk -v d="$dest" -v h="$hostpart" -v label="host $((10#$n))" -v jd="$JUMP_HOST" -v jh="${JUMP_HOST#*@}" '
                  function mark(s, needle, token,    out, i) {
                    out = ""
                    while ((i = index(s, needle)) > 0) { out = out substr(s, 1, i - 1) token; s = substr(s, i + length(needle)) }
                    return out s
                  }
                  {
                    s = $0
                    if (jd != "") { s = mark(mark(s, jd, "\002"), jh, "\002") }
                    s = mark(mark(s, d, "\001"), h, "\001")
                    gsub(/\001/, label, s)
                    gsub(/\002/, "the jump host", s)
                    print s
                  }' > "$cleaned"
          fi
          size=$(wc -c < "$cleaned" | tr -d ' ')
          total_bytes=$((total_bytes + size))

          hits=""
          for entry in "${patterns[@]}"; do
            name="${entry%%|*}"
            regex="${entry#*|}"
            if grep -Eiq -e "$regex" "$cleaned"; then
              hits="${hits:+$hits, }$name"
            fi
          done
          if [ -s "$keylines" ] && grep -Fq -f "$keylines" "$cleaned"; then
            hits="${hits:+$hits, }ci-key-material"
          fi

          show=true
          if [ -n "$hits" ]; then
            show=false
            verdict="failed"
            kind="withheld"
            note="the diff matched a secret pattern ($hits) and is withheld"
          elif [ "$size" -gt "$per_host_cap" ] || [ "$total_bytes" -gt "$total_cap" ]; then
            show=false
            verdict="failed"
            kind="withheld"
            note="the diff is too large to show whole, so it cannot be approved from here"
          fi

          case "$verdict" in
            clean) clean=$((clean + 1)) ;;
            changes) changed=$((changed + 1)) ;;
            *) failed=$((failed + 1)) ;;
          esac
          printf '%s\n' "$kind" >> "$kinds"

          label="host $((10#$n))"
          result="$verdict"
          if [ "$FAIL_ON_CHANGES" = true ]; then
            result="$kind"
          fi
          printf '| %s | %s | %s |\n' "$label" "$result" "${note:--}" >> "$rows"
          if [ "$show" = true ] && [ -s "$cleaned" ]; then
            fence=$(awk 'BEGIN { m = 2 } { s = $0; while (match(s, /`+/)) { if (RLENGTH > m) m = RLENGTH; s = substr(s, RSTART + RLENGTH) } } END { f = ""; for (k = 0; k <= m; k++) f = f "`"; print f }' "$cleaned")
            {
              printf '\n### %s\n\n' "$label"
              printf '%stext\n' "$fence"
              cat "$cleaned"
              printf '%s\n' "$fence"
            } >> "$details"
          fi
        done

        # The outcome names the kind of each answer that was not clean, with a
        # count and never a host name, for the summary and for an alert.
        detail=""
        while read -r count name; do
          case "$name" in
            ok) continue ;;
            drift) part="drift: $count changed" ;;
            refused:*) part="$name ($count)" ;;
            unreachable) part="unreachable ($count)" ;;
            no-answer) part="no usable answer ($count)" ;;
            withheld) part="diff withheld ($count)" ;;
            *) part="$name ($count)" ;;
          esac
          detail="${detail:+$detail; }$part"
        done < <(sort "$kinds" | uniq -c)
        others=$(grep -v '^ok$' "$kinds" | sed 's/^refused: .*/refused/' | sort -u || true)
        other_count=$(printf '%s' "$others" | grep -c . || true)
        case "$other_count" in
          0) outcome="ok" ;;
          1) outcome="$others" ;;
          *) outcome="mixed" ;;
        esac

        if [ "$FAIL_ON_CHANGES" = true ]; then
          if [ "$outcome" = ok ]; then
            first="No drift: every host reports no change for commit $SHA."
          else
            first="Not clean at commit $SHA: $detail."
          fi
        elif [ "$failed" -gt 0 ]; then
          first="Plan failed: $failed of $total host(s) gave no usable answer, so no approval is requested for commit $SHA."
        elif [ "$changed" -eq 0 ]; then
          first="No changes: every host reports none for commit $SHA, so the apply is skipped and no approval is requested."
        else
          first="Changes: $changed of $total host(s) would change for commit $SHA, so the apply waits for the approval of environment $ENVIRONMENT."
        fi
        if [ "$DRY_RUN" = true ]; then
          first="DRY RUN, the host call is a stub and nothing is applied. $first"
        fi
        {
          printf '%s\n\n' "$first"
          printf '| Host | Result | Note |\n| --- | --- | --- |\n'
          cat "$rows"
          cat "$details"
        } > "$summary"
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        echo "detail=${detail:-none}" >> "$GITHUB_OUTPUT"

        if [ "$failed" -gt 0 ]; then
          echo "::error::$first"
          exit 1
        fi
        if [ "$FAIL_ON_CHANGES" = true ] && [ "$changed" -gt 0 ]; then
          echo "::error::$first"
          exit 1
        fi
        if [ "$changed" -eq 0 ] && [ "$clean" -eq "$total" ] && [ "$total" -ge 1 ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi
        echo "$first"
