name: Ansible gated apply (self-test)

# This repo tests the reusable workflow with its own working copy (the local
# path below), not a tagged one, so a pull request that changes the workflow is
# checked by the change itself. It runs on every pull request, with no path
# filter, so a change elsewhere in the repo cannot skip it.
#
# The caller runs lint and Molecule over the fixture project. On a pull request
# the plan and apply jobs are skipped, as they are for every caller. On a push
# to main the plan job runs with the host call replaced by the stub in the
# fixture (a dry run), and the apply job never runs. No host exists to call.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Workflow step tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests of the workflow's steps
        run: python3 -m unittest discover -s tools -p 'test_ansible_gated_apply.py' -v

  # The expected failure. It runs the install and the ansible-lint steps of the
  # reusable workflow's `lint` job, taken from the workflow file by
  # tools/run_workflow_steps.py so that the commands have one home, on a role that
  # holds one deliberate error, and passes only when ansible-lint fails for that
  # rule with that exit status. A non-zero exit alone is not a pass. It proves
  # that ansible-lint, with the workflow's own flags, rejects bad input; it does
  # not prove yamllint, mypy or ruff, and it does not prove that the `lint` job is
  # wired into the gate (a lint error added to the real fixture proves that). The
  # rule id, the status and the summary line are the ones in
  # .github/fixtures/ansible-gated-apply/lint-fail/README.md.
  lint-expected-fail:
    name: The lint rejects the lint-fail role
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the lint steps of the reusable workflow on the lint-fail role
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/lint-fail.log"
          status=0
          python3 tools/run_workflow_steps.py .github/workflows/ansible-gated-apply.yml lint \
            --input working-directory=.github/fixtures/ansible-gated-apply \
            --input ansible-directory=ansible \
            --step "Create the tool environment" \
            --step "Install the pinned tools" \
            --step "ansible-lint at the production profile" \
            --step-input "ansible-lint at the production profile" ansible-directory=lint-fail \
            > "$log" 2>&1 || status=$?
          cat "$log"
          fail() {
            echo "::error::$1"
            exit 1
          }
          [ "$status" = 2 ] || fail "The lint steps ended with exit status $status on the lint-fail role. Expected 2, the status of ansible-lint when it finds a violation."
          grep -Fq 'name[missing]: All tasks should be named.' "$log" || fail "ansible-lint did not report the rule name[missing]."
          grep -Fq 'Failed: 1 failure(s), 0 warning(s)' "$log" || fail "ansible-lint did not report exactly one failure."
          echo "ansible-lint rejected the lint-fail role for name[missing], with exit status 2."

  gated-apply:
    uses: ./.github/workflows/ansible-gated-apply.yml
    with:
      environment: ansible-self-test
      working-directory: .github/fixtures/ansible-gated-apply
      dry-run: true
      dry-run-stub: stub/host.sh
    secrets:
      ssh_hosts: |
        ci@first-stub-host
        ci@second-stub-host
