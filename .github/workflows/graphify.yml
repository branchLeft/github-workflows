name: graphify (reusable)

# Headless, incremental knowledge-graph rebuild for a single repo, callable
# from any branchLeft-owned repo via `workflow_call`. Uses `graphify extract`
# (graphifyy's CI-native command, not the Claude-Code-oriented /graphify
# skill) so it needs no agent/subagent dispatch — it calls the configured LLM
# backend directly for doc/paper/image extraction, or runs AST-only with
# `--code-only` when no backend key is configured yet.
#
# Caller usage (in the target repo):
#
#   jobs:
#     graphify:
#       uses: branchLeft/github-workflows/.github/workflows/graphify.yml@v1.0.6
#       with:
#         working-directory: .          # optional, default: repo root
#         publish: pull-request         # required where the default branch is
#                                       # protected against direct pushes
#       secrets: inherit

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to run graphify against, relative to repo root"
        type: string
        default: "."
      gemini-model:
        description: "Gemini model for semantic extraction (overrides the org default)"
        type: string
        default: ""
      graphify-version:
        description: "graphifyy release to install (overrides the pinned default)"
        type: string
        default: "0.9.38"
      force:
        description: "Full re-scan instead of the default incremental update"
        type: boolean
        default: false
      publish:
        description: "How the graph reaches the default branch: 'direct' (commit straight to it) or 'pull-request'"
        type: string
        default: "direct"
      publish-branch:
        description: "Branch the graph is pushed to when publish is 'pull-request'"
        type: string
        default: "graphify"
    secrets:
      GEMINI_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graphify-${{ github.repository }}-${{ inputs.working-directory }}
  cancel-in-progress: false

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      # Checked before extraction so a typo fails in seconds rather than after
      # a full paid Gemini run.
      - name: Validate publish mode
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          case "$PUBLISH" in
            direct | pull-request) ;;
            *)
              echo "::error::publish must be 'direct' or 'pull-request', got '$PUBLISH'."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the default branch is checked out, so without this the extraction
      # resumes from whatever graph last landed there. While a graph PR sits
      # unmerged that is stale, and every run re-pays for the same extraction.
      - name: Seed the graph from the publish branch
        if: inputs.publish == 'pull-request'
        working-directory: ${{ inputs.working-directory }}
        env:
          BRANCH: ${{ inputs.publish-branch }}
        run: |
          set -eu
          if ! git fetch --depth 1 origin "$BRANCH"; then
            echo "No '$BRANCH' branch — resuming from the default branch's graph."
            exit 0
          fi
          # The ./ is load-bearing: without it the rev:path form resolves from
          # the repo root while the checkout pathspec below resolves from here,
          # so the two would disagree under a non-root working-directory.
          if ! git rev-parse --verify -q "FETCH_HEAD:./graphify-out" >/dev/null; then
            echo "'$BRANCH' carries no graphify-out — resuming from the default branch's graph."
            exit 0
          fi
          # Cleared first so paths the branch has dropped do not survive as a
          # union of the two trees.
          rm -rf graphify-out
          git checkout FETCH_HEAD -- graphify-out
          echo "Resumed from '$BRANCH'."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned because graphify-out/cache/ast/ is keyed by this version: an
      # unpinned upgrade rotates that whole directory and lands as a diff that
      # reads like graph drift rather than a dependency bump.
      - name: Install graphify
        env:
          VERSION: ${{ inputs.graphify-version }}
        run: pip install "graphifyy[gemini]==${VERSION}"

      - name: Run graphify extract
        working-directory: ${{ inputs.working-directory }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GRAPHIFY_GEMINI_MODEL: ${{ inputs.gemini-model || vars.GRAPHIFY_GEMINI_MODEL }}
          # graphify snapshots the previous graph into graphify-out/<date>/ before
          # overwriting it. That guards an un-reproducible local build; here the
          # previous graph is already in git, so the snapshot is just committed bloat.
          GRAPHIFY_NO_BACKUP: "1"
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          ARGS=(extract . --no-gitignore)
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::GEMINI_API_KEY not set for this repo — running --code-only (AST graph only, no doc/image extraction). See github-workflows/README.md to enable full extraction."
            ARGS+=(--code-only)
          else
            ARGS+=(--backend gemini)
            if [ -n "${GRAPHIFY_GEMINI_MODEL:-}" ]; then
              ARGS+=(--model "${GRAPHIFY_GEMINI_MODEL}")
            fi
          fi
          graphify "${ARGS[@]}"

      - name: Publish graph
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          BRANCH: ${{ inputs.publish-branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          git config user.name "graphify-bot"
          git config user.email "graphify-bot@users.noreply.github.com"

          if [ "$PUBLISH" = "pull-request" ]; then
            # Rebuilt from the base commit every run rather than accumulated:
            # where this mode is needed the required status checks are strict,
            # so a branch that lagged base would block its own merge.
            git checkout -B "$BRANCH"
          fi

          git add -A graphify-out/
          # graphify stamps the building machine's scan root and interpreter path
          # into these on every run, so any committed copy is a foreign absolute
          # path that outranks the correct root derived from graph.json's location.
          git rm --cached --ignore-unmatch -q \
            graphify-out/.graphify_root \
            graphify-out/.graphify_python
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
            exit 0
          fi

          if [ "$PUBLISH" = "direct" ]; then
            git commit -m "chore(graphify): update knowledge graph [skip ci]"
            git push
            exit 0
          fi

          git commit -m "chore(graphify): update knowledge graph [skip ci]"
          git push --force origin "$BRANCH"

          # The PR title, not this commit, is what lands as the squash-merge
          # commit's subject when nothing overrides it — true for `gh pr merge`
          # with no --subject and for the GitHub UI's pre-filled message box.
          # GitHub skips starting any push/pull_request-triggered workflow run
          # for a commit whose message carries "[skip ci]", so putting it in
          # the title means every merge path (this repo's own merge tooling, a
          # bare `gh pr merge`, or the web UI) skips firing the target repo's
          # deploy workflows, with no dependence on how the PR gets merged.
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base "$BASE" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --repo "$GITHUB_REPOSITORY" \
              --title "chore(graphify): update knowledge graph [skip ci]"
            echo "Updated the open graph PR: #${OPEN}"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base "$BASE" \
            --title "chore(graphify): update knowledge graph [skip ci]" \
            --body "Generated by the graphify workflow. Only \`graphify-out/\` changes.

          This branch is force-rebuilt from \`${BASE}\` on every run, so while this PR
          is open it always shows one commit holding the current graph. Merging it is
          never urgent — leave it and it keeps catching up."
