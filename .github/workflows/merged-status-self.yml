name: merged-status

# This repo tests the writer with its own working copy rather than by calling
# the reusable workflow at a tag -- otherwise a pull request that changes the
# rules would be checked by the previously tagged version of them.

on:
  pull_request:
    paths:
      - .github/workflows/merged-status.yml
      - tools/merged-status.py
      - tools/merged-status-workflow.test.sh
      - .github/workflows/merged-status-self.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/merged-status.yml
      - tools/merged-status.py
      - tools/merged-status-workflow.test.sh
      - .github/workflows/merged-status-self.yml
  schedule:
    - cron: '17 4 * * 1'

# One run per pull request: a newer push cancels the superseded run. A push,
# schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  merged-status-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the merged-status unit tests
        run: python3 tools/merged-status.py --self-test

      - name: Check the reusable workflow's runner seam
        run: ./tools/merged-status-workflow.test.sh
