name: Docs lint

# This repo lints itself with its own working copy rather than by calling the
# reusable workflow at @v1 — otherwise a PR that changes the rules would be
# checked by the previously tagged version of them.

on:
  pull_request:
  push:
    branches: [main]

# One run per pull request: a newer push cancels the superseded run. A push,
# schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    # Observed 0.17-0.97min over the last 20 successful runs (p95 0.93min).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the pinned-ref resolver tests
        run: ./tools/resolve-pinned-ref.test.sh

      - name: Check the reusable workflow's runner seam
        run: ./tools/docs-lint-workflow.test.sh

      - name: Run docs-lint unit tests
        run: ./tools/docs-lint.test.sh

      - name: Run docs-lint
        run: ./tools/docs-lint.sh --explain
