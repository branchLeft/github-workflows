name: codeowners-self

# Runs the CODEOWNERS ownership check against this repo's own working copy.

on:
  pull_request:
    paths:
      - .github/CODEOWNERS
      - tools/test_codeowners.py
      - .github/workflows/codeowners-self.yml
  push:
    branches: [main]
    paths:
      - .github/CODEOWNERS
      - tools/test_codeowners.py
      - .github/workflows/codeowners-self.yml
  schedule:
    - cron: '17 4 * * 1'

# One run per pull request: a newer push cancels the superseded run. A push,
# schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeowners-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check who owns the sample paths
        run: python3 tools/test_codeowners.py
