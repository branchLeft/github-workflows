name: docs-lint (reusable)

# Enforces the org documentation standard on markdown and code comments,
# callable from any branchLeft-owned repo via `workflow_call`.
#
# Uses only actions/checkout plus `run:` steps, so it passes under
# `allowed_actions: selected` without any per-repo allow-list change.
#
# Behaviour is controlled by files in the calling repo, not by inputs:
#   .docs-lint.mode        absent = enforce, `warn` = ratchet (see rules doc)
#   .docs-lintignore       path-scoped rule exemptions
#
# Caller usage (in the target repo):
#
#   jobs:
#     docs-lint:
#       uses: branchLeft/github-workflows/.github/workflows/docs-lint.yml@v1.0.6

on:
  workflow_call:
    inputs:
      explain:
        description: "Print the matched text for each finding"
        type: boolean
        default: true
      runs-on:
        description: "Runner labels for the job, as a JSON array string; the default is GitHub-hosted ubuntu-latest"
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  docs-lint:
    # The caller picks the runner. A caller that passes nothing keeps
    # GitHub-hosted ubuntu-latest, so existing pins behave as before.
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # Observed 0.2-0.63min p95 across 60 caller runs (shared-infra,
    # ghost-platform, website, components; 15 each) plus one 7.35min outlier —
    # headroom set above that outlier, not just the p95.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Warn mode diffs against the merge base to decide which files are
          # enforced, so the full history has to be present.
          fetch-depth: 0

      # The revision the caller pinned, read from the caller's own workflow
      # files checked out above. The job_workflow_sha context is empty inside a
      # reusable workflow, and an empty `ref:` makes actions/checkout take the
      # default branch, so the pin would be decorative. Fails closed on none or
      # on two distinct pins. This body is tools/resolve-pinned-ref.sh, inlined
      # because the pinned revision cannot be fetched before it is known.
      - name: Resolve the revision the caller pinned
        id: pin
        env:
          CALLED_WORKFLOW: docs-lint.yml
        run: |
          set -euo pipefail
          workflow_re='^[A-Za-z0-9._-]+\.yml$'
          [[ "${CALLED_WORKFLOW:-}" =~ $workflow_re ]] || { echo "::error::CALLED_WORKFLOW must name a workflow file."; exit 1; }
          workflow_pat="uses:[[:space:]]*['\"]?branchLeft/github-workflows/\.github/workflows/${CALLED_WORKFLOW//./\\.}"
          ref_pat="@[^[:space:]\"'#]+"
          refs=$(grep -rhoE "${workflow_pat}${ref_pat}" .github/workflows/ 2>/dev/null | sed 's/.*@//' | sort -u || true)
          n=$(printf '%s' "$refs" | grep -c . || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one pinned ${CALLED_WORKFLOW} revision under .github/workflows/, found ${n}: ${refs}. Refusing to run unpinned tooling."
            exit 1
          fi
          printf 'ref=%s\n' "$refs" >> "${GITHUB_OUTPUT:-/dev/stdout}"
          echo "Running branchLeft/github-workflows@$refs"

      - name: Checkout docs-lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: branchLeft/github-workflows
          ref: ${{ steps.pin.outputs.ref }}
          path: .docs-lint
          persist-credentials: false

      - name: Run docs-lint
        env:
          EXPLAIN: ${{ inputs.explain }}
        run: |
          set -eu
          ARGS=""
          if [ "$EXPLAIN" = "true" ]; then ARGS="--explain"; fi
          .docs-lint/tools/docs-lint.sh $ARGS
