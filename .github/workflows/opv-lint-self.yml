name: opv-lint

# This repo lints itself with its own working copy rather than by calling the
# reusable workflow at @v1 -- otherwise a PR that changes the rules would be
# checked by the previously tagged version of them.
#
# No path filter: opv-lint reads every tracked file, so any change can break it.

on:
  pull_request:
  push:
    branches: [main]

# One run per pull request: a newer push cancels the superseded run. A push,
# schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  opv-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run opv-lint unit tests
        run: ./tools/opv-lint.test.sh

      - name: Run opv-lint
        run: ./tools/opv-lint.sh --explain
