name: Ansible gated apply

# The reusable CI for a repository that keeps Ansible roles and delivers them to
# hosts by the gated pull (ANS-17). Rules, inputs, secrets, the one-time setup
# and the named limits are in the README ("ansible-gated-apply.yml").
#
# Five kinds of job. `discover` validates the inputs and lists the Molecule
# shards. `lint` runs the static checks once. `shard` runs Molecule once per
# role. `plan` asks each host, through the restricted route, what an apply of
# this exact commit would change and shows it. `apply` waits on the deployment
# gate and then asks each host to apply that same commit. The job named
# `Ansible checks passed` is the one a caller requires.
#
# Concurrency (job groups only; there is no workflow-level group, which would
# queue a newer run behind a run that waits for approval). On a delivery run
# (a push to the default branch of the repository itself) discover, lint and
# each Molecule leg sit in a group of their own with cancel-in-progress, so a
# newer push cancels the checks of an older one that has not reached a host.
# Every other event gets a group unique to the run and behaves as before. The
# plan job has one group per repository and is never cancelled: a queued plan
# replaces an older queued plan, and a running plan finishes. A superseded run
# ends red ("reported cancelled, expected success") and plans nothing. The
# apply job keeps its own group, is never cancelled, and an approval that is
# waiting is never replaced: a newer apply queues behind it. The drift check
# shares the plan group, since both ask the same host lock.
#
# A host that fails its plan fails the plan, and nothing is applied, unless the
# caller sets skip-failed-hosts: then the plan goes on without the failed hosts,
# the apply covers only the hosts that passed (their places in the host list are
# checked by the apply guard), and the checks job stays red while any host was
# skipped. README: "When one host fails its plan".
#
# CI never holds a root shell. The only host access is an SSH key whose
# authorized_keys line on the host runs one forced command, and that command
# takes one commit id and nothing else. The plan job holds the check key. The
# apply job holds the apply key, which is an environment secret, so only a job
# that has passed the environment's approval can read it.

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Name of the GitHub deployment environment that holds the required
          reviewers and the apply key. The apply job runs in it, so the
          approval click is GitHub's, not this workflow's.
        type: string
        required: true
      working-directory:
        description: >-
          The directory, relative to the repository root, that holds the
          Ansible directory, .ansible-lint and .yamllint.
        type: string
        required: false
        default: '.'
      ansible-directory:
        description: >-
          The Ansible directory, relative to working-directory. It holds
          requirements.txt (the hash lock of every package, collections
          included), pyproject.toml, and requirements.yml if there is one, which
          must hold only an empty collections list.
        type: string
        required: false
        default: ansible
      role-directories:
        description: >-
          Globs, one per line, relative to ansible-directory, of the directories
          that each hold a Molecule scenario at molecule/default.
        type: string
        required: false
        default: roles/*
      role-test-command:
        description: >-
          A Python script, relative to ansible-directory, that tests one role
          directory: it is run as `python <script> <role directory>` from
          ansible-directory and its exit status is the role's result. Set it to
          the entry point the repository's pull request gate runs, so delivery
          and the gate run one sequence. Empty (the default) runs `molecule
          test` and then `molecule check` in the role directory.
        type: string
        required: false
        default: ''
      python-paths:
        description: >-
          Paths, space separated and relative to ansible-directory, that mypy
          and ruff check.
        type: string
        required: false
        default: .
      dry-run:
        description: >-
          Replace the SSH call with dry-run-stub and never run the apply job.
          For the self-test of this workflow; a dry run can only skip an apply,
          never perform one.
        type: boolean
        required: false
        default: false
      dry-run-stub:
        description: >-
          With dry-run, the executable, relative to working-directory, that
          stands in for the host. It receives the destination and the commit.
        type: string
        required: false
        default: ''
      push-playbook:
        description: >-
          With the ssh_push_hosts secret, the playbook the receiver of a pushed
          host is asked to run: a relative path of letters, digits, dot,
          underscore, dash and slash, with no '..'. Ignored when ssh_push_hosts
          is empty.
        type: string
        required: false
        default: ''
      push-dry-run-stub:
        description: >-
          With dry-run and ssh_push_hosts, the executable, relative to
          working-directory, that stands in for the receiver of a pushed host. It
          receives the destination, the mode, the commit and the playbook, and
          the bundle on standard input.
        type: string
        required: false
        default: ''
      host-timeout-minutes:
        description: One host call is stopped after this many minutes.
        type: number
        required: false
        default: 65
      plan-timeout-minutes:
        description: The plan job is stopped after this many minutes.
        type: number
        required: false
        default: 90
      apply-timeout-minutes:
        description: The apply job is stopped after this many minutes, not counting the wait for approval.
        type: number
        required: false
        default: 180
      shard-timeout-minutes:
        description: Each Molecule shard job, one per role, is stopped after this many minutes.
        type: number
        required: false
        default: 30
      skip-rerun-after-merge-group:
        description: >-
          For a caller whose merge queue already runs these same checks on the
          tree that is then pushed. On a push to the default branch, skip the
          lint and Molecule jobs and, before anything reaches a host, require
          that the check named by merge-group-check-name passed for the pushed
          commit in a merge queue run; the discover job fails if it did not, or
          if that cannot be read. Every other run is unchanged. The default,
          false, keeps lint and Molecule on every run.
        type: boolean
        required: false
        default: false
      merge-group-check-name:
        description: >-
          With skip-rerun-after-merge-group, the name of the check run the
          caller's merge queue run publishes for this gate, as GitHub shows it
          (caller job name, then ' / ', then 'Ansible checks passed'). Required
          then; ignored otherwise.
        type: string
        required: false
        default: ''
      skip-failed-hosts:
        description: >-
          false (the default) keeps the plan all-or-nothing: one host that fails
          its check fails the plan, and no host is applied. true lets a delivery
          go on without the hosts that failed their plan: the plan still judges
          every host the same way, the apply (after its approval) covers only the
          hosts that passed, the failed hosts get nothing until a later plan finds
          them clean, and the run still ends red while any host was skipped. Leave
          it false when a commit can depend on an order across hosts (a role on one
          host that another host needs), because a skipped host breaks that order.
          A plan in which no host passed still fails.
        type: boolean
        required: false
        default: false
    secrets:
      ssh_hosts:
        description: >-
          The hosts to plan and apply, one SSH destination per line in the form
          user@host. Each is reached only through the forced command. A secret,
          so the job log masks the names. Pass it from a repository secret.
        required: false
      ssh_push_hosts:
        description: >-
          Optional: pass from a secret. The hosts that never open a connection
          themselves, one user@host per line, a subset of ssh_hosts. Each is
          reached through ssh_jump_host, which is then required with
          ssh_jump_key, and is sent a git bundle of the commit on standard input
          with the command '<mode> <commit> <push-playbook>' instead of being
          asked to fetch it. Needs push-playbook and a public repository. Empty
          (the default) leaves every host on the pull route.
        required: false
      ssh_check_key:
        description: >-
          The private key of the plan job. On the host it is restricted to the
          forced command in check mode. Pass it from a repository secret.
        required: false
      ssh_host_check_keys:
        description: >-
          Optional: pass from a repository secret. One JSON object,
          {"user@host": "<private key text>"}, whose keys are exact lines of
          ssh_hosts. A host with an entry is checked with that key and no other,
          so a leaked key reaches one host only. Every host with no entry keeps
          ssh_check_key. Each key differs from every other key here, from
          ssh_check_key and from the jump keys.
        required: false
      ssh_known_hosts:
        description: The known_hosts lines of the hosts. Pass it from a repository secret.
        required: false
      ssh_apply_key:
        description: >-
          The private key of the apply job. Do not pass it. Store it as a secret
          of the deployment environment, which the apply job reads because it
          runs in that environment.
        required: false
      ssh_host_apply_keys:
        description: >-
          Optional: the apply keys of the hosts that have one of their own, in
          the form of ssh_host_check_keys. Store it as a secret of the deployment
          environment, which the apply job reads because it runs in that
          environment, and pass the same secret from the caller too, so that the
          value arrives either way. A host with no entry keeps ssh_apply_key.
        required: false
      ssh_jump_host:
        description: >-
          Optional: pass from a secret; both or neither with ssh_jump_key. A
          user@host, in the form ssh_hosts takes, that every host is reached
          through (ssh ProxyJump), for hosts with no public address. Its host-key
          line goes in ssh_known_hosts.
        required: false
      ssh_jump_key:
        description: >-
          Optional: pass from a secret; both or neither with ssh_jump_host. The
          private key for the jump host and nothing else, never the check key or
          the apply key. The jump host restricts it to port 22 of the listed hosts.
        required: false
      ssh_jump2_host:
        description: >-
          Optional: pass from a secret; all three of ssh_jump2_host, ssh_jump2_key
          and ssh_jump2_hosts, or none. A user@host, in the form ssh_hosts takes,
          that the hosts in ssh_jump2_hosts are reached through after ssh_jump_host
          (ssh ProxyJump, two hops), for hosts behind a gateway that only the first
          jump host can reach. Needs ssh_jump_host and ssh_jump_key. Its host-key
          line goes in ssh_known_hosts.
        required: false
      ssh_jump2_key:
        description: >-
          Optional: pass from a secret; all three of ssh_jump2_host, ssh_jump2_key
          and ssh_jump2_hosts, or none. The private key for the second jump host and
          nothing else, never the check key, the apply key or ssh_jump_key. The second
          jump host restricts it to port 22 of the listed hosts.
        required: false
      ssh_jump2_hosts:
        description: >-
          Optional: pass from a secret; all three of ssh_jump2_host, ssh_jump2_key
          and ssh_jump2_hosts, or none. The hosts that are reached through both
          jump hosts, one user@host per line, a subset of ssh_hosts. Every other
          host keeps the single hop. The second jump host's own address is not
          listed: it is reached through the first hop alone.
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover the Ansible checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ansible-ci-discover-${{ github.repository }}-${{ inputs.environment }}-${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork != true && 'delivery' || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    outputs:
      delivery: ${{ steps.context.outputs.delivery }}
      recheck: ${{ steps.context.outputs.rerun }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Delivery happens only for a push to the default branch of the
      # repository itself. The host refuses a commit that is not on its main, so
      # a plan on a pull request could not work either. Every other event runs
      # the checks and nothing that reaches a host.
      - name: Decide whether this run may reach a host
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_FORK: ${{ github.event.repository.fork }}
          ENVIRONMENT: ${{ inputs.environment }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
          SKIP_RERUN: ${{ inputs.skip-rerun-after-merge-group }}
        run: |
          set -euo pipefail
          for value in "$WORKING_DIRECTORY" "$ANSIBLE_DIRECTORY"; do
            case "$value" in
              "" | /* | *..* | *[!A-Za-z0-9._/-]*)
                echo "::error::A directory input must be a relative path of letters, digits, dot, underscore, dash and slash, with no '..'."
                exit 1
                ;;
            esac
          done
          if ! printf '%s' "$ENVIRONMENT" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
            echo "::error::The environment input must name a deployment environment: letters, digits, dot, underscore and dash, at most 64 characters."
            exit 1
          fi
          delivery=false
          if [ "$EVENT_NAME" = push ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] && [ "$IS_FORK" != true ]; then
            delivery=true
          fi
          echo "delivery=$delivery" >> "$GITHUB_OUTPUT"
          echo "This run reaches a host: $delivery"
          # Only a delivery run may skip lint and Molecule, and only after the
          # next step has shown the merge queue ran them on this commit.
          rerun=true
          if [ "$delivery" = true ] && [ "$SKIP_RERUN" = true ]; then
            rerun=false
          fi
          echo "rerun=$rerun" >> "$GITHUB_OUTPUT"
          echo "This run runs lint and Molecule: $rerun"

      # The proof that lets a delivery run skip lint and Molecule. The merge
      # queue runs this workflow on the tree it then pushes, so the same commit
      # carries a passing check run of the gate job, made by GitHub Actions in a
      # check suite of a queue branch (gh-readonly-queue/...). A run of the gate
      # in the push itself is on a suite of the default branch, so it does not
      # count. Anything that cannot be read, or does not match, fails the job:
      # the plan and the apply need this job, so nothing reaches a host.
      - name: Confirm the merge queue passed this commit
        id: confirm
        if: steps.context.outputs.rerun == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHECK_NAME: ${{ inputs.merge-group-check-name }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [ -n "$CHECK_NAME" ] || fail "skip-rerun-after-merge-group needs merge-group-check-name, the check to look for."
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || fail "The commit is not 40 lowercase hex digits."
          runs=$(gh api --paginate -X GET "repos/$REPO/commits/$SHA/check-runs" -f per_page=100 -f check_name="$CHECK_NAME") \
            || fail "The check runs of the commit could not be read, so nothing shows the merge queue passed it. Refusing."
          suites=$(printf '%s' "$runs" | jq -r --arg name "$CHECK_NAME" --arg sha "$SHA" \
            '.check_runs[]? | select(.name == $name and .status == "completed" and .conclusion == "success" and .head_sha == $sha and .app.slug == "github-actions") | .check_suite.id | tostring' | sort -u) \
            || fail "The check runs of the commit could not be understood. Refusing."
          id_re='^[0-9]+$'
          for suite_id in $suites; do
            [[ "$suite_id" =~ $id_re ]] || continue
            suite=$(gh api "repos/$REPO/check-suites/$suite_id") \
              || fail "A check suite of the commit could not be read, so nothing shows the merge queue passed it. Refusing."
            if printf '%s' "$suite" | jq -e --arg sha "$SHA" '(.head_branch // "" | startswith("gh-readonly-queue/")) and .head_sha == $sha' > /dev/null; then
              echo "The merge queue passed $CHECK_NAME for commit $SHA."
              exit 0
            fi
          done
          fail "No passing '$CHECK_NAME' check from a merge queue run was found for commit $SHA. Refusing to deliver without lint and Molecule."

      # Every directory the globs match is one shard, and each must hold a
      # scenario: a role with none fails here, so it cannot pass untested. An
      # empty list fails, because an empty matrix would skip the shard job and
      # the gate would have nothing to be red about.
      #
      # Nothing is fetched from Galaxy (ANS-4). Molecule has two ways to reach it,
      # and this step closes both.
      #  - The dependency step: each scenario must set dependency.enabled to
      #    false.
      #  - Molecule's prerun, which is on by default and which this workflow
      #    leaves on, because it is what makes a role resolve by its full name.
      #    It installs from Galaxy every requirements file at the six paths
      #    ansible-compat searches under the role directory (listed below), and
      #    the dependencies of a galaxy.yml. So each of those files that exists
      #    must hold exactly `collections: []`, and no galaxy.yml or galaxy.yaml
      #    may exist anywhere under the Ansible directory. That is wider than the
      #    places prerun looks, on purpose: it needs no copy of ansible-compat's
      #    search rules.
      # The search by name does not see through a link, and prerun resolves every
      # direct entry of the role directory, and the role directory itself. So
      # that directory and each direct entry of it that is a link is judged by
      # where it resolves, and refused when it cannot be resolved, when it leaves
      # the Ansible directory, when it is a file named galaxy.yml or galaxy.yaml,
      # or when it or its parent directory holds either file. Every role
      # directory is also judged by its physical path, link or not, because
      # Molecule runs there: one reached through a linked parent directory that
      # leaves the Ansible directory is refused. A link deeper down is not read
      # by prerun and is left alone, because shared-infra has legitimate ones
      # there. Not covered: a role directory whose physical path is directly
      # under the Ansible directory (a link inside the tree can put one there),
      # where prerun also reads a galaxy.yml two levels above it, outside the
      # tree this step can see.
      # The requirements.yml of the Ansible directory itself is held to the same
      # shape. yq reads each file and jq judges it; a file yq cannot parse, or a
      # missing yq, fails the step. The other home of that rule is shared-infra's
      # ansible/checks/check_pins.py; the README ("Named limits") says how the two
      # differ.
      - name: List the Molecule shards from the repository tree
        id: shards
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
          ROLE_DIRECTORIES: ${{ inputs.role-directories }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY/$ANSIBLE_DIRECTORY"
          shopt -s nullglob
          found=()
          while IFS= read -r glob; do
            [ -n "$glob" ] || continue
            case "$glob" in
              /* | *..* | *[!A-Za-z0-9._*/-]*)
                echo "::error::A role-directories line must be a relative glob of letters, digits, dot, underscore, dash, star and slash, with no '..'."
                exit 1
                ;;
            esac
            for dir in $glob/; do
              found+=("${dir%/}")
            done
          done <<< "$ROLE_DIRECTORIES"
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::No directory matched role-directories, so nothing would be tested."
            exit 1
          fi
          root=$(pwd -P)
          refuse_link() {
            local path=$1 resolved
            [ -L "$path" ] || return 0
            if ! resolved=$(realpath "$path" 2> /dev/null) || [ ! -e "$path" ]; then
              echo "::error::$path is a link that cannot be resolved, so what Molecule's prerun would read through it cannot be judged (ANS-4)."
              exit 1
            fi
            case "$resolved" in
              "$root" | "$root"/*) ;;
              *)
                echo "::error::$path is a link that leaves the Ansible directory: Molecule's prerun resolves it and reads what it reaches (ANS-4)."
                exit 1
                ;;
            esac
            case "${resolved##*/}" in
              galaxy.yml | galaxy.yaml)
                echo "::error::$path is a link to a file named galaxy.yml or galaxy.yaml: Molecule's prerun installs its dependencies from Galaxy (ANS-4)."
                exit 1
                ;;
            esac
            if [ -e "$resolved/galaxy.yml" ] || [ -e "$resolved/galaxy.yaml" ] || [ -e "${resolved%/*}/galaxy.yml" ] || [ -e "${resolved%/*}/galaxy.yaml" ]; then
              echo "::error::$path is a link into a directory holding a galaxy.yml or galaxy.yaml: Molecule's prerun installs its dependencies from Galaxy (ANS-4)."
              exit 1
            fi
          }
          for dir in "${found[@]}"; do
            refuse_link "$dir"
            physical=$(cd "$dir" && pwd -P)
            case "$physical" in
              "$root" | "$root"/*) ;;
              *)
                echo "::error::$dir is a role directory whose physical path leaves the Ansible directory, through a link in a parent directory: Molecule runs there and its prerun reads a galaxy.yml two levels above it (ANS-4)."
                exit 1
                ;;
            esac
            if [ ! -f "$dir/molecule/default/molecule.yml" ]; then
              echo "::error::$dir has no molecule/default/molecule.yml (ANS-15)."
              exit 1
            fi
            if ! yq -o=json . "$dir/molecule/default/molecule.yml" | jq -e '.dependency.enabled == false' > /dev/null; then
              echo "::error::$dir/molecule/default/molecule.yml must set dependency.enabled to false, so Molecule's dependency step never reaches Galaxy (ANS-4)."
              exit 1
            fi
            for file in requirements.yml roles/requirements.yml collections/requirements.yml tests/requirements.yml tests/integration/requirements.yml tests/unit/requirements.yml; do
              if [ -e "$dir/$file" ] || [ -L "$dir/$file" ]; then
                if ! yq -o=json . "$dir/$file" | jq -e '. == {"collections": []}' > /dev/null; then
                  echo "::error::$dir/$file must hold only 'collections: []': Molecule's prerun installs what it lists from Galaxy (ANS-4)."
                  exit 1
                fi
              fi
            done
            shopt -s dotglob
            for entry in "$dir"/*; do
              refuse_link "$entry"
            done
            shopt -u dotglob
          done
          galaxy_file=$(find . \( -name galaxy.yml -o -name galaxy.yaml \) -print | sed -n 1p)
          if [ -n "$galaxy_file" ]; then
            echo "::error::$galaxy_file must not exist: Molecule's prerun installs the dependencies of a galaxy.yml from Galaxy (ANS-4)."
            exit 1
          fi
          if [ -e requirements.yml ] || [ -L requirements.yml ]; then
            if ! yq -o=json . requirements.yml | jq -e '. == {"collections": []}' > /dev/null; then
              echo "::error::requirements.yml must hold only 'collections: []'. The lock is requirements.txt, and nothing is fetched from Galaxy (ANS-4)."
              exit 1
            fi
          fi
          printf 'Molecule runs over %s role(s):\n' "${#found[@]}"
          printf '  %s\n' "${found[@]}"
          matrix=$(printf '%s\n' "${found[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({name: ., path: .}) | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint the Ansible inputs
    needs: [discover]
    if: needs.discover.outputs.recheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ansible-ci-lint-${{ github.repository }}-${{ inputs.environment }}-${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork != true && 'delivery' || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools find each other on PATH (Molecule runs ansible-config), so the
      # environment's bin directory is put there for the steps that follow.
      - name: Create the tool environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      # Every package, with its hash, comes from the one lock (ANS-4). pip
      # refuses a line that has no hash. The shard job below carries the same two
      # steps word for word; a test pins that they stay equal.
      - name: Install the pinned tools
        env:
          ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes -r "$ANSIBLE_DIRECTORY/requirements.txt"'

      - name: yamllint every YAML file under the Ansible directory
        env:
          ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
        run: '"$RUNNER_TEMP/ansible-venv/bin/yamllint" --strict -c .yamllint "$ANSIBLE_DIRECTORY"'

      # --offline: ansible-lint installs nothing from Galaxy and refreshes no
      # schema, so a requirements.yml cannot add code outside the lock.
      - name: ansible-lint at the production profile
        env:
          ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
        run: '"$RUNNER_TEMP/ansible-venv/bin/ansible-lint" --offline --strict "$ANSIBLE_DIRECTORY"'

      - name: Type-check the Python
        working-directory: ${{ inputs.working-directory }}/${{ inputs.ansible-directory }}
        env:
          PYTHON_PATHS: ${{ inputs.python-paths }}
        run: |
          set -euo pipefail
          read -r -a paths <<< "$PYTHON_PATHS"
          "$RUNNER_TEMP/ansible-venv/bin/mypy" "${paths[@]}"

      - name: Lint the Python
        working-directory: ${{ inputs.working-directory }}/${{ inputs.ansible-directory }}
        env:
          PYTHON_PATHS: ${{ inputs.python-paths }}
        run: |
          set -euo pipefail
          read -r -a paths <<< "$PYTHON_PATHS"
          "$RUNNER_TEMP/ansible-venv/bin/ruff" check "${paths[@]}"

      - name: Check the Python formatting
        working-directory: ${{ inputs.working-directory }}/${{ inputs.ansible-directory }}
        env:
          PYTHON_PATHS: ${{ inputs.python-paths }}
        run: |
          set -euo pipefail
          read -r -a paths <<< "$PYTHON_PATHS"
          "$RUNNER_TEMP/ansible-venv/bin/ruff" format --check "${paths[@]}"

  shard:
    name: 'Molecule: ${{ matrix.name }}'
    needs: [discover]
    if: needs.discover.outputs.recheck == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.shard-timeout-minutes }}
    concurrency:
      group: ansible-ci-shard-${{ github.repository }}-${{ inputs.environment }}-${{ matrix.name }}-${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork != true && 'delivery' || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      ROLE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ANS-15: the container test never reaches another engine. A set variable
      # would point the Docker driver at it, so a set variable fails the job.
      - name: Refuse a redirected container engine
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_HOST:-}" ]; then
            echo "::error::DOCKER_HOST is set, so the container test could reach another engine (ANS-15)."
            exit 1
          fi

      # The tools find each other on PATH (Molecule runs ansible-config), so the
      # environment's bin directory is put there for the steps that follow.
      - name: Create the tool environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install the pinned tools
        env:
          ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
        run: '"$RUNNER_TEMP/ansible-venv/bin/pip" install --require-virtualenv --require-hashes -r "$ANSIBLE_DIRECTORY/requirements.txt"'

      # The one step that tests a role: no other step of this job runs Molecule,
      # so delivery cannot run a sequence the caller's gate does not. With
      # role-test-command the caller's own entry point is the whole test.
      - name: Test the role
        working-directory: ${{ inputs.working-directory }}/${{ inputs.ansible-directory }}
        env:
          ROLE_PATH: ${{ matrix.path }}
          ROLE_TEST_COMMAND: ${{ inputs.role-test-command }}
        run: |
          set -euo pipefail
          if [ -n "$ROLE_TEST_COMMAND" ]; then
            command_re='^[A-Za-z0-9_][A-Za-z0-9_./-]*[.]py$'
            if ! [[ "$ROLE_TEST_COMMAND" =~ $command_re ]] || [[ "$ROLE_TEST_COMMAND" == *..* ]]; then
              echo "::error::role-test-command must be a relative path to a .py file, with no '..'."
              exit 1
            fi
            if [ ! -f "$ROLE_TEST_COMMAND" ]; then
              echo "::error::role-test-command names a file that does not exist under the Ansible directory."
              exit 1
            fi
            "$RUNNER_TEMP/ansible-venv/bin/python" "$ROLE_TEST_COMMAND" "$ROLE_PATH"
          else
            cd "$ROLE_PATH"
            "$RUNNER_TEMP/ansible-venv/bin/molecule" test
            "$RUNNER_TEMP/ansible-venv/bin/molecule" check
          fi

  # The plan job. It runs only for a push to the default branch. It holds the
  # check key, which the host restricts to the forced command in check mode, and
  # no other credential. The commit it plans is the commit this run is for. The
  # host check itself is the composite action ssh-check-hosts, which a reusable
  # workflow cannot name as a local path, so the job checks this repository out
  # at the commit it was called at and runs the action from there.
  plan:
    name: Plan the apply (check mode on each host)
    needs: [discover, lint, shard]
    # lint and shard are skipped when the merge queue already ran them; a
    # skipped need would skip this job, so the condition names the statuses.
    # A need that a newer run cancelled (see the concurrency note at the top)
    # is neither success nor skipped, so this run plans nothing.
    if: >-
      ${{ !cancelled()
      && needs.discover.result == 'success'
      && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
      && (needs.shard.result == 'success' || needs.shard.result == 'skipped')
      && needs.discover.outputs.delivery == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.plan-timeout-minutes }}
    # One plan at a time per repository, because the host refuses a second
    # check while one holds its lock (busy, exit 21). Not cancelled: a queued
    # plan replaces an older queued one, and a plan that has started runs out.
    concurrency:
      group: ansible-plan-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    outputs:
      has_changes: ${{ steps.ssh.outputs.has-changes }}
      sha: ${{ steps.guard.outputs.sha }}
      hosts_digest: ${{ steps.ssh.outputs.hosts-digest }}
      push_hosts_digest: ${{ steps.ssh.outputs.push-hosts-digest }}
      jump2_hosts_digest: ${{ steps.ssh.outputs.jump2-hosts-digest }}
      apply_hosts: ${{ steps.ssh.outputs.apply-hosts }}
      failed_hosts: ${{ steps.ssh.outputs.failed-hosts }}
    steps:
      # Whether any host is pushed to. A step condition cannot read a secret, so
      # this step reads it and says so in an output. Everything else about the
      # push route is judged by the action.
      - name: Decide whether any host is pushed to
        id: push
        env:
          PUSH_HOSTS: ${{ secrets.ssh_push_hosts }}
        run: |
          set -euo pipefail
          if [ -n "$PUSH_HOSTS" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "Some hosts are pushed to, so the repository is checked out with its whole history."
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Only a dry run reads a file of this repository, the stand-in for the host.
      - name: Checkout
        if: inputs.dry-run == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pushed host is sent a bundle of this repository at the commit, with the
      # history the receiver needs for its own rules on order and on main. This
      # runs before the shared actions are placed at .gw, so the pin step still
      # sees a workspace with no .gw of the caller's.
      - name: Check out the repository with its whole history, to push it
        if: steps.push.outputs.push == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse outside a push to the default branch, and check the inputs
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_FORK: ${{ github.event.repository.fork }}
          SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry-run }}
          DRY_RUN_STUB: ${{ inputs.dry-run-stub }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [ "$EVENT_NAME" = push ] || fail "The plan job runs only for a push, not for $EVENT_NAME."
          [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] || fail "The plan job runs only for the default branch."
          [ "$IS_FORK" != true ] || fail "The plan job never runs in a fork."
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || fail "The commit is not 40 lowercase hex digits."
          [ -n "$ENVIRONMENT" ] || fail "The environment input is empty, so the apply would have no approval."
          if [ "$DRY_RUN" = true ]; then
            [ -n "$DRY_RUN_STUB" ] || fail "dry-run needs dry-run-stub."
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Planning commit $SHA."

      # The commit this workflow was called at is read from the run record, which
      # names the commit of every reusable workflow the run called. The runner
      # gives no value for it here (the job's own workflow commit context is empty), and an
      # empty ref would make the checkout below take the default branch and run
      # unpinned code with the key. So exactly one full commit id must be found,
      # and the path must be free of any file of the caller. Needs actions: read.
      # A caller pinned to a signed release tag is recorded under the id of the tag
      # object, not of its commit, so that id is peeled to the commit it points at,
      # and only a verified tag is accepted.
      - name: Resolve the commit this workflow was called at
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CALLED_WORKFLOW: branchLeft/github-workflows/.github/workflows/ansible-gated-apply.yml
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          run_re='^[0-9]+$'
          sha_re='^[0-9a-f]{40}$'
          [[ "$RUN_ID" =~ $run_re ]] || fail "The run id is not a number."
          record=$(gh api "repos/$REPO/actions/runs/$RUN_ID") \
            || fail "The run record could not be read, so the commit this workflow was called at is unknown. The caller must grant actions: read. Refusing to fall back to the default branch."
          called_select='(.referenced_workflows // [])[] | select(.path | startswith($prefix))'
          called=$(printf '%s' "$record" | jq -r --arg prefix "$CALLED_WORKFLOW@" "$called_select"' | "\(.sha) \(.path)"' | sort -u)
          tag_ref=$(printf '%s' "$record" | jq -r --arg prefix "$CALLED_WORKFLOW@" "$called_select"' | (.ref // empty | strings) | select(test("(^|\n)refs/tags/"))' | tr -cd 'A-Za-z0-9._/\n-' | sort -u)
          count=$(printf '%s' "$called" | grep -c . || true)
          [ "$count" -eq 1 ] || fail "The run record names $count commits for $CALLED_WORKFLOW, not exactly one. Refusing to fall back to the default branch."
          pinned="${called%% *}"
          [[ "$pinned" =~ $sha_re ]] || fail "The commit the run record names is not 40 lowercase hex digits. Refusing to fall back to the default branch."
          if [ -e "$GITHUB_WORKSPACE/.gw" ] || [ -L "$GITHUB_WORKSPACE/.gw" ]; then
            fail "The path .gw already exists in the workspace, so the shared actions cannot be checked out into a clean directory."
          fi
          commit="$pinned"
          shared=branchLeft/github-workflows
          err_file=$(mktemp)
          trap 'rm -f "$err_file"' EXIT
          first_line() { head -n 1 "$err_file" | tr -cd 'A-Za-z0-9 ().:_/-' | cut -c1-80; }
          if tag_json=$(gh api "repos/$shared/git/tags/$pinned" 2> "$err_file"); then
            fields=$(printf '%s' "$tag_json" | jq -r '
              def shown: if type == "string" and length > 0 then gsub("[^A-Za-z0-9._-]"; "?") | .[0:41] else "missing" end;
              [(.object.type | shown), (.object.sha | shown), (.verification.verified | if . == true then "true" elif . == false then "false" else "missing" end)] | @tsv') \
              || fail "The answer for the tag object $pinned could not be read. Refusing to fall back to the default branch."
            IFS=$'\t' read -r object_type peeled verified <<< "$fields"
            [ "$object_type" = commit ] || fail "The run record names the tag object $pinned, which points at an object of type $object_type, not a commit. Refusing to fall back to the default branch."
            [[ "$peeled" =~ $sha_re ]] || fail "The tag object $pinned points at a commit whose id is not 40 lowercase hex digits (found $peeled). Refusing to fall back to the default branch."
            [ "$verified" = true ] || fail "The tag object $pinned is not a verified tag (verified: $verified). Refusing to fall back to the default branch."
            commit="$peeled"
          elif grep -qxF 'gh: Not Found (HTTP 404)' "$err_file"; then
            tag_name=$(printf '%s\n' "$tag_ref" | head -n 1 | cut -c1-80)
            [ -z "$tag_ref" ] || fail "The run record names $pinned for the tag $tag_name, and that id is no tag object, so the tag is lightweight and carries no signature. Refusing to fall back to the default branch."
            plain=$(gh api "repos/$shared/git/commits/$pinned" --jq .sha 2> "$err_file") \
              || fail "The id $pinned is neither a tag object nor a commit of $shared (the commit read answered: $(first_line)). Refusing to fall back to the default branch."
            [ "$plain" = "$pinned" ] || fail "The commit read for $pinned answered a different id. Refusing to fall back to the default branch."
          else
            fail "The tag object $pinned could not be read (answered: $(first_line)). Refusing to fall back to the default branch."
          fi
          if [ "$commit" = "$pinned" ]; then
            echo "The shared actions are taken from commit $pinned, the commit of ${called#* }."
          else
            echo "The shared actions are taken from commit $commit, the commit tag object $pinned points at (${called#* })."
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out the shared actions at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: branchLeft/github-workflows
          ref: ${{ steps.pin.outputs.sha }}
          path: .gw
          persist-credentials: false

      - name: Verify the checkout is that commit
        env:
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          head=$(git -C "$GITHUB_WORKSPACE/.gw" rev-parse HEAD)
          [ "$head" = "$PINNED_SHA" ] || fail "The shared actions are at $head, not at the commit $PINNED_SHA this workflow was called at."
          [ -f "$GITHUB_WORKSPACE/.gw/.github/actions/ssh-check-hosts/action.yml" ] || fail "The checkout holds no ssh-check-hosts action."
          echo "The shared actions are at $head."

      - name: Check every host in check mode and write the plan
        id: ssh
        uses: ./.gw/.github/actions/ssh-check-hosts
        with:
          hosts: ${{ secrets.ssh_hosts }}
          known-hosts: ${{ secrets.ssh_known_hosts }}
          check-key: ${{ secrets.ssh_check_key }}
          host-check-keys: ${{ secrets.ssh_host_check_keys }}
          jump-host: ${{ secrets.ssh_jump_host }}
          jump-key: ${{ secrets.ssh_jump_key }}
          jump2-host: ${{ secrets.ssh_jump2_host }}
          jump2-key: ${{ secrets.ssh_jump2_key }}
          jump2-hosts: ${{ secrets.ssh_jump2_hosts }}
          push-hosts: ${{ secrets.ssh_push_hosts }}
          push-playbook: ${{ inputs.push-playbook }}
          push-dry-run-stub: ${{ inputs.push-dry-run-stub }}
          push-repo-private: ${{ github.event.repository.private }}
          sha: ${{ steps.guard.outputs.sha }}
          dry-run: ${{ inputs.dry-run }}
          dry-run-stub: ${{ inputs.dry-run-stub }}
          working-directory: ${{ inputs.working-directory }}
          host-timeout: ${{ inputs.host-timeout-minutes }}
          environment: ${{ inputs.environment }}
          skip-failed-hosts: ${{ inputs.skip-failed-hosts }}

  # The apply job. Its environment is the deployment gate: GitHub holds the job
  # until the environment's required reviewers approve it, and only then does it
  # read the environment's secret. It never runs in a pull request, in a fork, in
  # a dry run, or when the plan found nothing to change. If main has moved on
  # since the plan, the planned commit still applies. The host is the authority
  # on order: it refuses a commit older than the one it last applied, and this
  # job then fails with that reason.
  apply:
    name: Apply the planned commit (after approval)
    needs: [discover, plan]
    # lint and shard are skipped when the merge queue already ran them; an implicit
    # success() would then skip this job, so the condition names the statuses.
    if: >-
      !cancelled() && !failure()
      && needs.discover.outputs.delivery == 'true'
      && needs.plan.result == 'success'
      && needs.plan.outputs.has_changes != 'false'
      && inputs.dry-run == false
      && inputs.environment != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.apply-timeout-minutes }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: ansible-apply-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Refuse unless this is the approved, planned push
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_FORK: ${{ github.event.repository.fork }}
          SHA: ${{ github.sha }}
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
          HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
          PLANNED_DIGEST: ${{ needs.plan.outputs.hosts_digest }}
          PLANNED_APPLY_HOSTS: ${{ needs.plan.outputs.apply_hosts }}
          SKIP_FAILED_HOSTS: ${{ inputs.skip-failed-hosts }}
          HOSTS: ${{ secrets.ssh_hosts }}
          PLANNED_PUSH_DIGEST: ${{ needs.plan.outputs.push_hosts_digest }}
          PUSH_HOSTS: ${{ secrets.ssh_push_hosts }}
          PUSH_PLAYBOOK: ${{ inputs.push-playbook }}
          PUSH_REPO_PRIVATE: ${{ github.event.repository.private }}
          PLANNED_JUMP2_DIGEST: ${{ needs.plan.outputs.jump2_hosts_digest }}
          JUMP2_HOSTS: ${{ secrets.ssh_jump2_hosts }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [ "$EVENT_NAME" = push ] || fail "The apply job runs only for a push, not for $EVENT_NAME."
          [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] || fail "The apply job runs only for the default branch."
          [ "$IS_FORK" != true ] || fail "The apply job never runs in a fork."
          [ "$DRY_RUN" != true ] || fail "The apply job never runs in a dry run."
          [ -n "$ENVIRONMENT" ] || fail "The environment input is empty, so there is no approval."
          [ "$HAS_CHANGES" != false ] || fail "The plan found nothing to change."
          printf '%s' "$PLANNED_SHA" | grep -Eq '^[0-9a-f]{40}$' || fail "The planned commit is not 40 lowercase hex digits."
          [ "$PLANNED_SHA" = "$SHA" ] || fail "The planned commit differs from this run's commit."
          list=""
          host_count=0
          while IFS= read -r dest; do
            [ -n "$dest" ] || continue
            list="${list:+$list }$dest"
            host_count=$((host_count + 1))
          done <<< "$HOSTS"
          digest=$(printf '%s' "$list" | shasum -a 256 | cut -d ' ' -f 1)
          printf '%s' "$PLANNED_DIGEST" | grep -Eq '^[0-9a-f]{64}$' || fail "The planned host digest is missing."
          [ "$digest" = "$PLANNED_DIGEST" ] || fail "The hosts are not the hosts that were planned."
          # The hosts to apply, as the places in the hosts list that the plan found
          # clean or changing (the digest above proves the list is the planned one, so
          # a number means the same host as at plan time). The list is held to digits,
          # strictly ascending (so no repeat), none above the host count and not empty.
          # Unless the caller opted in to skip-failed-hosts, it must be every host, so a
          # plan that was not opted in can never produce a partial apply.
          case "$SKIP_FAILED_HOSTS" in true | false) ;; *) fail "skip-failed-hosts must be true or false." ;; esac
          # The pattern needs at least one number, so an empty list is refused here too.
          numbers_re='^[1-9][0-9]*( [1-9][0-9]*)*$'
          [[ "$PLANNED_APPLY_HOSTS" =~ $numbers_re ]] || fail "The planned apply hosts are not a list of one or more host numbers."
          previous=0
          apply_hosts=""
          for number in $PLANNED_APPLY_HOSTS; do
            [ "$number" -gt "$previous" ] || fail "The planned apply hosts are not in strictly ascending order."
            [ "$number" -le "$host_count" ] || fail "The planned apply hosts name a host beyond the end of the hosts list."
            previous="$number"
            apply_hosts="${apply_hosts:+$apply_hosts }$number"
          done
          if [ "$SKIP_FAILED_HOSTS" != true ]; then
            every=""
            for ((number = 1; number <= host_count; number++)); do
              every="${every:+$every }$number"
            done
            [ "$apply_hosts" = "$every" ] || fail "The plan covers only some of the hosts, but skip-failed-hosts is not true."
          fi
          echo "apply_hosts=$apply_hosts" >> "$GITHUB_OUTPUT"
          # The push list is held to the plan the same way. A list the plan did not
          # have, a list the plan had and this run lacks, and a different list all
          # differ from the planned digest, which is empty when the plan had none.
          # The playbook goes into the command sent to the host, so it is held to
          # the form the action held it to; this is a copy of that check and a
          # test holds the two equal. A bundle carries the whole history of the
          # repository, so a repository that is not public is refused here too.
          push=false
          push_list=""
          while IFS= read -r dest; do
            [ -n "$dest" ] || continue
            push_list="${push_list:+$push_list }$dest"
          done <<< "$PUSH_HOSTS"
          push_digest=""
          if [ -n "$push_list" ]; then
            push_digest=$(printf '%s' "$push_list" | shasum -a 256 | cut -d ' ' -f 1)
          fi
          [ "$push_digest" = "$PLANNED_PUSH_DIGEST" ] || fail "The pushed hosts are not the pushed hosts that were planned."
          if [ -n "$PUSH_HOSTS" ]; then
            printf '%s' "$PLANNED_PUSH_DIGEST" | grep -Eq '^[0-9a-f]{64}$' || fail "The planned push digest is missing."
            playbook_re='^[A-Za-z0-9_][A-Za-z0-9_./-]*$'
            [[ "$PUSH_PLAYBOOK" =~ $playbook_re ]] || fail "push-playbook must be a relative path of letters, digits, dot, underscore, dash and slash."
            case "$PUSH_PLAYBOOK" in *..*) fail "push-playbook must not contain '..'." ;; esac
            [ "$PUSH_REPO_PRIVATE" = false ] || fail "Pushing refuses unless the repository is public: a bundle carries its whole history to the host."
            push=true
          fi
          # The second-hop list is held to the plan the same way: the apply never
          # takes the second hop to a host that was not planned, and never drops it
          # for one that was. The digest is empty when the plan had no list.
          jump2_list=""
          while IFS= read -r dest; do
            [ -n "$dest" ] || continue
            jump2_list="${jump2_list:+$jump2_list }$dest"
          done <<< "$JUMP2_HOSTS"
          jump2_digest=""
          if [ -n "$jump2_list" ]; then
            jump2_digest=$(printf '%s' "$jump2_list" | shasum -a 256 | cut -d ' ' -f 1)
          fi
          [ "$jump2_digest" = "$PLANNED_JUMP2_DIGEST" ] || fail "The second-hop hosts are not the second-hop hosts that were planned."
          if [ -n "$JUMP2_HOSTS" ]; then
            printf '%s' "$PLANNED_JUMP2_DIGEST" | grep -Eq '^[0-9a-f]{64}$' || fail "The planned second-hop digest is missing."
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Applying the planned commit $PLANNED_SHA after the approval of $ENVIRONMENT."

      # A pushed host is sent a bundle of this repository at the commit, with its
      # whole history. Only a job that has passed the guard, and so the approval,
      # reads the repository for it.
      - name: Check out the repository with its whole history, to push it
        if: steps.guard.outputs.push == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply on each host, then run it again to prove nothing is left to change
        env:
          HOSTS: ${{ secrets.ssh_hosts }}
          APPLY_HOSTS: ${{ steps.guard.outputs.apply_hosts }}
          SHA: ${{ needs.plan.outputs.sha }}
          HOST_TIMEOUT_MINUTES: ${{ inputs.host-timeout-minutes }}
          SSH_KEY: ${{ secrets.ssh_apply_key }}
          HOST_KEYS: ${{ secrets.ssh_host_apply_keys }}
          KNOWN_HOSTS: ${{ secrets.ssh_known_hosts }}
          JUMP_HOST: ${{ secrets.ssh_jump_host }}
          JUMP_KEY: ${{ secrets.ssh_jump_key }}
          JUMP2_HOST: ${{ secrets.ssh_jump2_host }}
          JUMP2_KEY: ${{ secrets.ssh_jump2_key }}
          JUMP2_HOSTS: ${{ secrets.ssh_jump2_hosts }}
          PUSH_HOSTS: ${{ secrets.ssh_push_hosts }}
          PUSH_PLAYBOOK: ${{ inputs.push-playbook }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          destination_pattern='^[a-z_][a-z0-9_-]{0,31}@[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'
          [ -n "$APPLY_HOSTS" ] || fail "The guard published no host to apply."
          [ -n "$SSH_KEY" ] || [ -n "$HOST_KEYS" ] || fail "The ssh_apply_key secret is empty. It is a secret of the deployment environment."
          [ -n "$KNOWN_HOSTS" ] || fail "The ssh_known_hosts secret is empty."
          # A jump needs a host and a key, or neither. The host goes into an ssh
          # config file, so it is held to the form of a hosts line and to one line:
          # grep judges each line alone and would pass a good line with more after it.
          # This runs before any file is written or host contacted, and no message
          # holds a value.
          if [ -n "$JUMP_HOST" ] || [ -n "$JUMP_KEY" ]; then
            [ -n "$JUMP_HOST" ] || fail "ssh_jump_key is set but ssh_jump_host is empty: a jump needs both or neither."
            [ -n "$JUMP_KEY" ] || fail "ssh_jump_host is set but ssh_jump_key is empty: a jump needs both or neither."
            case "$JUMP_HOST" in *$'\n'*) fail "ssh_jump_host is not of the form user@host." ;; esac
            printf '%s' "$JUMP_HOST" | grep -Eq "$destination_pattern" \
              || fail "ssh_jump_host is not of the form user@host."
          fi
          # A pushed host is reached only through the jump host.
          if [ -n "$PUSH_HOSTS" ]; then
            { [ -n "$JUMP_HOST" ] && [ -n "$JUMP_KEY" ]; } || fail "ssh_push_hosts needs ssh_jump_host and ssh_jump_key: a pushed host is reached only through the jump host."
          fi
          # The second hop: host, key and list all set or all empty, the first hop
          # present, the list inside the hosts, no duplicate, no self-jump and a key
          # of its own. Before any file is written or host contacted. A copy of the
          # block in the ssh-check-hosts action, input names aside; a test holds the
          # two equal.
          # --- jump2 begin (this text is the same in ssh-check-hosts and in ansible-gated-apply.yml, input names aside; a test holds the two equal)
          jump2_list=""
          jump2_count=0
          if [ -n "$JUMP2_HOST" ] || [ -n "$JUMP2_KEY" ] || [ -n "$JUMP2_HOSTS" ]; then
            { [ -n "$JUMP_HOST" ] && [ -n "$JUMP_KEY" ]; } || fail "A second hop needs ssh_jump_host and ssh_jump_key: it is reached through the first hop."
            if [ -z "$JUMP2_HOST" ] && [ -z "$JUMP2_KEY" ]; then
              fail "ssh_jump2_hosts is set but there is no second hop (ssh_jump2_host and ssh_jump2_key are empty): a listed host would fall back to one hop."
            fi
            [ -n "$JUMP2_HOST" ] || fail "ssh_jump2_key is set but ssh_jump2_host is empty: a second hop needs both or neither."
            [ -n "$JUMP2_KEY" ] || fail "ssh_jump2_host is set but ssh_jump2_key is empty: a second hop needs both or neither."
            [ -n "$JUMP2_HOSTS" ] || fail "ssh_jump2_host and ssh_jump2_key are set but ssh_jump2_hosts is empty: a second hop with no listed host routes nothing."
            case "$JUMP2_HOST" in *$'\n'*) fail "ssh_jump2_host is not of the form user@host." ;; esac
            printf '%s' "$JUMP2_HOST" | grep -Eq "$destination_pattern" \
              || fail "ssh_jump2_host is not of the form user@host."
            [ "$JUMP2_KEY" != "$JUMP_KEY" ] || fail "ssh_jump2_key is the same as ssh_jump_key: each hop has its own key."
            [ "$JUMP2_KEY" != "$SSH_KEY" ] || fail "ssh_jump2_key is the same as this job's own key: the second hop has a key of its own."
            jump2_gateway=$(printf '%s' "${JUMP2_HOST#*@}" | tr '[:upper:]' '[:lower:]')
            while IFS= read -r dest; do
              [ -n "$dest" ] || continue
              # A listed host must equal a line of the hosts list, which was held to
              # the form of a hosts line, so a malformed line matches nothing.
              grep -qxF -- "$dest" <<< "$HOSTS" || fail "A line of ssh_jump2_hosts is not in the hosts list."
              case " $jump2_list " in *" $dest "*) fail "A line of ssh_jump2_hosts is listed twice." ;; esac
              [ "$(printf '%s' "${dest#*@}" | tr '[:upper:]' '[:lower:]')" != "$jump2_gateway" ] \
                || fail "A line of ssh_jump2_hosts is the address of the second hop itself: that host is reached through the first hop alone."
              jump2_list="${jump2_list:+$jump2_list }$dest"
              jump2_count=$((jump2_count + 1))
            done <<< "$JUMP2_HOSTS"
            [ "$jump2_count" -ge 1 ] || fail "ssh_jump2_hosts lists no host."
          fi
          # --- jump2 end
          # Per-host keys: a host with an entry is called with that key and no other,
          # and every host with none keeps the shared key. A copy of the block in the
          # ssh-check-hosts action; a test holds the two equal.
          # --- hostkeys-validate begin (this text is the same in ssh-check-hosts and in ansible-gated-apply.yml; a test holds the two equal)
          if [ -n "$HOST_KEYS" ]; then
            host_keys_verdict=$(jq -n -r '
              def trim: gsub("\r"; "") | sub("\\A\\s+"; "") | sub("\\s+\\z"; "");
              (try ($ENV.HOST_KEYS | fromjson) catch null) as $map
              | ($ENV.HOSTS | split("\n") | map(select(length > 0))) as $hosts
              | ([$ENV.SSH_KEY] | map((. // "") | trim) | map(select(. != ""))) as $shared
              | ([$ENV.JUMP_KEY, $ENV.JUMP2_KEY] | map((. // "") | trim) | map(select(. != ""))) as $jump
              | if ($map | type) != "object" then "not-object"
                elif ($map | length) == 0 then "empty"
                elif any($map[]; (type != "string") or (trim == "")) then "bad-value"
                elif any($map | keys[]; . as $k | all($hosts[]; . != $k)) then "unknown-host"
                elif ([$map[] | trim] | length) != ([$map[] | trim] | unique | length) then "duplicate"
                elif any($map[]; . as $v | any($shared[]; . == ($v | trim))) then "shared"
                elif any($map[]; . as $v | any($jump[]; . == ($v | trim))) then "jump"
                elif ($ENV.DRY_RUN != "true") and ($shared | length) == 0 and any($hosts[]; . as $h | ($map | has($h)) | not) then "no-key"
                else "ok"
                end
            ' 2> /dev/null) || fail "The host keys could not be read."
            case "$host_keys_verdict" in
              ok) ;;
              not-object) fail "The host keys are not one JSON object of user@host to private key text." ;;
              empty) fail "The host keys are an empty object: leave them empty to use the shared key for every host." ;;
              bad-value) fail "A host key is not a non-empty string." ;;
              unknown-host) fail "A line of the host keys is not in the hosts list." ;;
              duplicate) fail "Two hosts have the same key: each host has a key of its own." ;;
              shared) fail "A host key is the same as the shared key: a host with its own key has a key of its own." ;;
              jump) fail "A host key is the same as a jump key: each route has its own key." ;;
              no-key) fail "A host has no key: it has no entry in the host keys and there is no shared key." ;;
              *) fail "The host keys could not be judged." ;;
            esac
          fi
          # --- hostkeys-validate end
          work="$RUNNER_TEMP/ansible-apply"
          mkdir "$work"
          # The key copies go on every way out of the step, a refusal included.
          trap 'rm -f "$work/id" "$work/known_hosts" "$work"/id.*' EXIT
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$work/id" && printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts")
          # A host with an entry in the host keys reads its key from id.NN, NN being
          # its place in the hosts list; every other host reads id. The files are
          # private, the trap above removes them, and each line of a key is masked.
          # A copy of the block in the ssh-check-hosts action; a test holds the two equal.
          # --- hostkeys-write begin (this text is the same in ssh-check-hosts and in ansible-gated-apply.yml, the directory variable aside; a test holds the two equal)
          host_key_index=0
          if [ -n "$HOST_KEYS" ]; then
            while IFS= read -r host_key_dest; do
              [ -n "$host_key_dest" ] || continue
              host_key_index=$((host_key_index + 1))
              host_key_file="$work/id.$(printf '%02d' "$host_key_index")"
              host_key_has=0
              jq -n -e --arg dest "$host_key_dest" '($ENV.HOST_KEYS | fromjson) | has($dest)' > /dev/null 2>&1 || host_key_has=$?
              case "$host_key_has" in
                0)
                  (
                    umask 077
                    jq -n -j --arg dest "$host_key_dest" '($ENV.HOST_KEYS | fromjson)[$dest] | gsub("\r"; "") | sub("\\A\\s+"; "") | sub("\\s+\\z"; "")' > "$host_key_file"
                    printf '\n' >> "$host_key_file"
                  )
                  while IFS= read -r host_key_line; do
                    echo "::add-mask::$host_key_line"
                  done < <(awk 'length($0) >= 16 && $0 !~ /^-----/' "$host_key_file")
                  ;;
                1)
                  : # no entry: this host keeps the shared key, which the validate block has shown is set
                  ;;
                *)
                  fail "The host keys could not be read."
                  ;;
              esac
            done <<< "$HOSTS"
          fi
          # --- hostkeys-write end
          ssh_args=(-T -i "$work/id" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=30
            -o ForwardAgent=no -o ClearAllForwardings=yes)
          ssh_args_two=()
          if [ -n "$JUMP_HOST" ]; then
            # ssh gives a jump hop none of the options on the command line, so the
            # hop is a stanza of its own with its own key and strict options. The
            # alias holds an underscore, which no validated host name can, so no
            # target can select the stanza. User and host were validated as one
            # line of the hosts form before they are written here. The trap is set
            # again, with the jump files, before either file exists. This stanza is
            # a copy of the one in the ssh-check-hosts action; a test holds the two
            # equal.
            trap 'rm -f "$work/id" "$work/known_hosts" "$work"/id.* "$work/jump_id" "$work/jump_config"' EXIT
            (
              umask 077
              printf '%s\n' "$JUMP_KEY" > "$work/jump_id"
              {
                printf 'Host jump_hop\n'
                printf '  HostName %s\n' "${JUMP_HOST#*@}"
                printf '  User %s\n' "${JUMP_HOST%%@*}"
                printf '  IdentityFile %s\n' "$work/jump_id"
                printf '  IdentitiesOnly yes\n'
                printf '  BatchMode yes\n'
                printf '  StrictHostKeyChecking yes\n'
                printf '  UserKnownHostsFile %s\n' "$work/known_hosts"
                printf '  GlobalKnownHostsFile /dev/null\n'
                printf '  ConnectTimeout 30\n'
                printf '  ServerAliveInterval 30\n'
                printf '  ForwardAgent no\n'
                printf '  ClearAllForwardings yes\n'
              } > "$work/jump_config"
            )
            ssh_args+=(-F "$work/jump_config" -o ProxyJump=jump_hop)
            # The second hop. A copy of the block in the ssh-check-hosts action
            # (the key file is jump2_id there too); a test holds the two equal.
            if [ -n "$JUMP2_HOST" ]; then
              trap 'rm -f "$work/id" "$work/known_hosts" "$work"/id.* "$work/jump_id" "$work/jump_config" "$work/jump2_id"' EXIT
              (
                umask 077
                printf '%s\n' "$JUMP2_KEY" > "$work/jump2_id"
                {
                  printf 'Host jump_hop2\n'
                  printf '  HostName %s\n' "${JUMP2_HOST#*@}"
                  printf '  User %s\n' "${JUMP2_HOST%%@*}"
                  printf '  IdentityFile %s\n' "$work/jump2_id"
                  printf '  IdentitiesOnly yes\n'
                  printf '  BatchMode yes\n'
                  printf '  StrictHostKeyChecking yes\n'
                  printf '  UserKnownHostsFile %s\n' "$work/known_hosts"
                  printf '  GlobalKnownHostsFile /dev/null\n'
                  printf '  ConnectTimeout 30\n'
                  printf '  ServerAliveInterval 30\n'
                  printf '  ForwardAgent no\n'
                  printf '  ClearAllForwardings yes\n'
                } >> "$work/jump_config"
              )
              ssh_args_two=("${ssh_args[@]}")
              ssh_args_two[$((${#ssh_args_two[@]} - 1))]=ProxyJump=jump_hop,jump_hop2
            fi
          fi
          # One ssh call: the chain of the host (one or two) picks the argument list,
          # and the identity file replaces the value of its one -i, in a copy of the
          # list: a second -i would offer the shared key to a host that has its own.
          # A copy of the function in the ssh-check-hosts action; a test holds the two
          # equal. Arguments: chain, the time limit, the identity file, then what follows the options.
          ssh_via() {
            local chain="$1" limit="$2" identity="$3" index
            shift 3
            local args=("${ssh_args[@]}")
            if [ "$chain" = two ]; then
              args=("${ssh_args_two[@]}")
            fi
            for index in "${!args[@]}"; do
              if [ "${args[$index]}" = -i ]; then
                args[$((index + 1))]="$identity"
                break
              fi
            done
            timeout "$limit" ssh "${args[@]}" "$@"
          }
          re='^pull-trigger verdict=([a-z-]+) exit=([0-9]+) reason=([a-z-]+) mode=apply commit=([0-9a-f]{40}) playbook=[A-Za-z0-9_./-]+ changed=([0-9]+|-)( floor=[0-9a-f]{40})?$'
          # The line of a pushed host. A copy of the one in the ssh-check-hosts
          # action; a test holds the two equal. Each host is judged by its route
          # and by the one line its route speaks.
          push_re='^push-receiver verdict=([a-z-]+) exit=([0-9]+) reason=([a-z-]+) mode=(check|apply) commit=([0-9a-f]{40}) playbook=[A-Za-z0-9_./-]+ changed=([0-9]+)( floor=[0-9a-f]{40})?$'

          # The bundle of a pushed host, made once before any host is asked and
          # read from its start by each call. The same text as in the action.
          push_bundle=""
          if [ -n "$PUSH_HOSTS" ]; then
            # --- bundle begin (this text is the same in ssh-check-hosts and in ansible-gated-apply.yml; a test holds the two equal)
            make_bundle() {
              local file="$1" sha="$2" head
              [ "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository)" = false ] \
                || fail "The checkout of the repository is shallow, so its bundle would not carry the history the host needs."
              head=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD) || fail "The checkout of the repository could not be read."
              [ "$head" = "$sha" ] || fail "The checkout of the repository is not at the commit being delivered."
              git -C "$GITHUB_WORKSPACE" bundle create "$file" HEAD > /dev/null 2>&1 || fail "The bundle of the commit could not be made."
            }
            # --- bundle end
            push_bundle="$work/push.bundle"
            make_bundle "$push_bundle" "$SHA"
          fi

          # Run one request and require the answer to be one of the accepted
          # kinds. Arguments: host number, destination, label, then the accepted
          # answers as "exit:verdict" words. The playbook output is dropped: it
          # is on the host, and the job log is public. A pulled host's call takes
          # its input from /dev/null: the host loop below reads the host list from
          # its own standard input, and ssh would swallow the hosts after the
          # first. A pushed host's call takes the bundle from its file, from the
          # start, so the second run gets a fresh stream.
          ask() {
            local num="$1" dest="$2" label="$3" route=pull
            shift 3
            local rc=0 out line accepted ok=1 matched=no f_verdict="" f_exit="" f_reason="" f_commit="" f_changed="" f_floor="" why=""
            if [ -n "$PUSH_HOSTS" ] && grep -qxF -- "$dest" <<< "$PUSH_HOSTS"; then
              route=push
            fi
            # Only a host the second-hop list names takes the second hop.
            local chain=one
            if [ -n "$JUMP2_HOSTS" ] && grep -qxF -- "$dest" <<< "$JUMP2_HOSTS"; then
              chain=two
            fi
            # The key this host is called with: its own file when the host keys have an
            # entry for it, else the shared one. Both runs of a host use the same key.
            local identity="$work/id"
            if [ -e "$work/id.$(printf '%02d' "$num")" ]; then
              identity="$work/id.$(printf '%02d' "$num")"
            fi
            if [ "$route" = push ]; then
              out=$(ssh_via "$chain" "${HOST_TIMEOUT_MINUTES}m" "$identity" -- "$dest" "apply $SHA $PUSH_PLAYBOOK" < "$push_bundle" 2> /dev/null) || rc=$?
            else
              out=$(ssh_via "$chain" "${HOST_TIMEOUT_MINUTES}m" "$identity" -- "$dest" "$SHA" < /dev/null 2> /dev/null) || rc=$?
            fi
            line=$(printf '%s\n' "$out" | tr -d '\r' | head -n 1)
            if [ "$rc" = 255 ]; then
              fail "Host $num, $label: the SSH connection failed (exit 255)."
            fi
            if [ "$(printf '%s\n' "$out" | wc -l | tr -d ' ')" = 1 ]; then
              if [ "$route" = push ]; then
                if [[ "$line" =~ $push_re ]] && [ "${BASH_REMATCH[4]}" = apply ]; then
                  matched=yes
                  f_verdict="${BASH_REMATCH[1]}"
                  f_exit="${BASH_REMATCH[2]}"
                  f_reason="${BASH_REMATCH[3]}"
                  f_commit="${BASH_REMATCH[5]}"
                  f_changed="${BASH_REMATCH[6]}"
                  f_floor="${BASH_REMATCH[7]# floor=}"
                fi
              elif [[ "$line" =~ $re ]]; then
                matched=yes
                f_verdict="${BASH_REMATCH[1]}"
                f_exit="${BASH_REMATCH[2]}"
                f_reason="${BASH_REMATCH[3]}"
                f_commit="${BASH_REMATCH[4]}"
                f_changed="${BASH_REMATCH[5]}"
                f_floor="${BASH_REMATCH[6]# floor=}"
              fi
            fi
            if [ "$matched" != yes ]; then
              fail "Host $num, $label: the host did not answer with one summary line (exit $rc)."
            fi
            if [ "$f_commit" != "$SHA" ] || [ "$f_exit" != "$rc" ]; then
              fail "Host $num, $label: the summary line names another commit or exit status (exit $rc)."
            fi
            for accepted in "$@"; do
              if [ "$accepted" = "$rc:$f_verdict" ]; then
                ok=0
              fi
            done
            if [ "$ok" -ne 0 ] || [ "$f_changed" = - ] || { [ "$f_verdict" = unchanged ] && [ "$f_changed" != 0 ]; }; then
              why="verdict $f_verdict, reason $f_reason, exit $rc."
              # A refusal of an older commit names both commits, so the log says what was
              # refused and what the host holds. Only a floor that matched 40 lowercase hex
              # digits is ever printed; the host's journal holds it when the line has none.
              if [ "$f_reason" = rollback ] && [ "$f_verdict" = refused ] && [ "$f_exit" = 20 ]; then
                why="$why The planned commit is $SHA."
                if [ -n "$f_floor" ]; then
                  why="$why The host's last applied commit is $f_floor."
                else
                  why="$why The host's last applied commit is in the host's journal."
                fi
              fi
              fail "Host $num, $label: $why"
            fi
            REPLY_VERDICT="$f_verdict"
          }

          # A host listed for the second hop is never called without it. The block
          # above has already refused a list with no second hop; this holds the step
          # to the same, because an unset array expands to nothing and the host would
          # be called with no options at all.
          if [ -n "$JUMP2_HOSTS" ] && [ "${#ssh_args_two[@]}" -eq 0 ]; then
            fail "ssh_jump2_hosts is set but no second hop is configured."
          fi
          # i counts every host of the list, so a host's number, its key file id.NN and
          # its route keep their meaning whether or not the hosts before it are
          # skipped. A host the guard did not list failed its plan: it is not asked at
          # all, and a later plan will find it clean before it receives this commit.
          i=0
          applied=0
          while IFS= read -r dest; do
            [ -n "$dest" ] || continue
            i=$((i + 1))
            case " $APPLY_HOSTS " in
              *" $i "*) ;;
              *)
                printf 'Host %s: skipped, its plan failed.\n' "$i" >> "$GITHUB_STEP_SUMMARY"
                continue
                ;;
            esac
            applied=$((applied + 1))
            ask "$i" "$dest" "apply" "10:applied" "0:unchanged"
            first="$REPLY_VERDICT"
            ask "$i" "$dest" "the second run, which must change nothing" "0:unchanged"
            printf 'Host %s: %s, then a second run that changed nothing.\n' "$i" "$first" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$HOSTS"
          echo "Applied commit $SHA on $applied host(s)."
          if [ "$applied" -lt "$i" ]; then
            echo "$((i - applied)) host(s) were skipped because their plan failed."
          fi

  # The check a caller requires. It runs even when a needed job failed or was
  # skipped, and it fails unless each needed job ended as expected for this
  # kind of run. In a run that never reaches a host, plan and apply must have
  # been skipped; a plan or apply that ran there is a defect and fails.
  checks:
    name: Ansible checks passed
    needs: [discover, lint, shard, plan, apply]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have ended as expected
        env:
          DISCOVER: ${{ needs.discover.result }}
          DELIVERY: ${{ needs.discover.outputs.delivery }}
          LINT: ${{ needs.lint.result }}
          SHARD: ${{ needs.shard.result }}
          PLAN: ${{ needs.plan.result }}
          APPLY: ${{ needs.apply.result }}
          HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
          FAILED_HOSTS: ${{ needs.plan.outputs.failed_hosts }}
          DRY_RUN: ${{ inputs.dry-run }}
          RERUN: ${{ needs.discover.outputs.recheck }}
        run: |
          set -euo pipefail
          problems=0
          expect() {
            if [ "$2" != "$3" ]; then
              echo "The $1 job reported $2, expected $3."
              problems=1
            fi
          }
          expect discover "$DISCOVER" success
          case "$RERUN" in
            true)
              expect lint "$LINT" success
              expect shard "$SHARD" success
              ;;
            false)
              expect lint "$LINT" skipped
              expect shard "$SHARD" skipped
              ;;
            *)
              echo "The discover job did not say whether lint and Molecule run: '$RERUN'."
              problems=1
              ;;
          esac
          case "$DELIVERY" in
            true)
              expect plan "$PLAN" success
              if [ "$DRY_RUN" = true ] || [ "$HAS_CHANGES" = false ]; then
                expect apply "$APPLY" skipped
              else
                expect apply "$APPLY" success
              fi
              # A plan can succeed with hosts left out (skip-failed-hosts). The hosts that
              # passed are delivered, and the run stays red while any host was skipped, so
              # a host that gets nothing is never silent.
              case "$FAILED_HOSTS" in
                "" | 0) ;;
                *)
                  echo "$FAILED_HOSTS host(s) failed their plan and were skipped."
                  problems=1
                  ;;
              esac
              ;;
            false)
              expect plan "$PLAN" skipped
              expect apply "$APPLY" skipped
              ;;
            *)
              echo "The discover job did not say whether this run reaches a host: '$DELIVERY'."
              problems=1
              ;;
          esac
          if [ "$problems" -ne 0 ]; then
            echo "Every job must end as expected."
            exit 1
          fi
          echo "Every job ended as expected."
