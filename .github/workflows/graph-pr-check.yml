name: graph-pr-check (reusable)

# Posts a commit status onto CI's own `chore(graphify)` pull requests, callable
# from any branchLeft-owned repo via `workflow_call`.
#
# Those PRs are opened with `GITHUB_TOKEN`, and GitHub does not start new
# `push`/`pull_request`-triggered workflow runs for events raised by that
# token — so a required check declared with either trigger never fires on
# them, and they can only be merged with a ruleset bypass. This workflow is
# triggered a different way: the *caller* listens for the completion of the
# repo's own `graphify` workflow run (a `workflow_run` event, which is not
# subject to that restriction, because the completing run was itself started
# by an ordinary push), then calls this with the commit that triggered that
# run. `tools/graph-pr-resolve.sh` turns that into the open graph PR it
# belongs to — see its header for why that match is on `baseRefOid`, not
# `headRefOid` — and the status is then posted to that PR's own
# `headRefOid`, which is the only commit GitHub evaluates a PR's checks
# against. Those are two different commits; see `tools/graph-pr-report.sh`.
#
# What it checks mirrors the shape the org's `--admin` merge authorisation
# already covers: bot author, the `graphify` head branch, the `chore(graphify)`
# title, and — the substantive part — a diff confined to `graphify-out/`. That
# last check is what stops a graph PR smuggling a source change through a
# merge path that otherwise skips review. The check logic lives in
# `tools/graph-pr-check.sh` so it can be exercised directly, outside CI.
#
# Caller usage (in the target repo, alongside its existing graphify.yml):
#
#   name: graph-pr-check
#
#   on:
#     workflow_run:
#       workflows: ["graphify"]
#       types: [completed]
#
#   jobs:
#     graph-pr-check:
#       permissions:
#         pull-requests: read
#         statuses: write
#       uses: branchLeft/github-workflows/.github/workflows/graph-pr-check.yml@v1.0.9
#       with:
#         head-sha: ${{ github.event.workflow_run.head_sha }}

on:
  workflow_call:
    inputs:
      head-sha:
        description: "The completed workflow run's head_sha — the commit the graph PR is resolved FROM, not the commit the status is posted to"
        type: string
        required: true
      status-context:
        description: "Commit status context name — must match the required check name configured on the branch"
        type: string
        default: "graph-pr-check"

permissions:
  pull-requests: read
  statuses: write

jobs:
  graph-pr-check:
    runs-on: ubuntu-latest
    # Observed 0.15-0.20min over the first five real runs (shared-infra,
    # 2026-09-05). Left generous rather than retuned to that: the job is two
    # `gh` API calls, so anything approaching a minute means API trouble
    # rather than work, and a tight bound would only convert a slow API into
    # a red that says nothing about the PR being checked.
    timeout-minutes: 20
    steps:
      # Own tooling, not the caller's — the script this job runs never lives
      # in the calling repo, so it is fetched from the exact commit this
      # reusable workflow was called at (never a tag: see docs-lint.yml).
      - name: Checkout graph-pr-check tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: branchLeft/github-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .graph-pr-check

      - name: Evaluate and report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.head-sha }}
          CONTEXT: ${{ inputs.status-context }}
        # Resolves the open graph PR from $SHA and posts the verdict to that
        # PR's own head commit — see the header of graph-pr-report.sh for why
        # those are two different commits, and graph-pr-report.test.sh for the
        # pinned regression case. The logic lives in a script so it can be
        # exercised outside CI; inline in this step it could not be tested at
        # all, which is how it shipped posting to the wrong commit.
        run: .graph-pr-check/tools/graph-pr-report.sh
