name: Ansible gated step (self-test)

# The tests of the step sender, run against this working copy, not a tagged
# one, so a pull request that changes the workflow is checked by the change
# itself. It runs on every pull request and every push to main, with no path
# filter. No host exists to call: the send job is tested with a stand-in for ssh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Step sender tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests of the step sender
        run: python3 -m unittest discover -s tools -p 'test_ansible_gated_step.py' -v

  # Each control is broken in a copy of the repository and the test that
  # guards it must go red, after a run of the unedited tree that must be green.
  # The log of this job is the recorded red and green of every control.
  sabotage:
    name: Step sender sabotage proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Break each control and require its test to go red
        run: python3 tools/sabotage_step.py
