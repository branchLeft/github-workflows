name: SSH jump (self-test)

# The proof, on real sshd instances, that the jump hops of the
# ssh-check-hosts action work under ClearAllForwardings=yes and that the key
# of a jump host opens its destinations and nothing else. It runs the steps of
# the action in this working copy, so a pull request that changes the action is
# checked by the change itself. It runs when a pull request or a push to main touches a path listed
# under `on:`, and every Monday on a schedule, which catches a dependency the
# list missed.
#
# The two servers listen on port 22 of two loopback addresses, because the
# action's inputs take no port, so the script needs root and runs itself under
# sudo. The keys and accounts are created for the run and removed at its end.
# No secret, no real host and no network beyond the runner's own loopback.

on:
  pull_request:
    paths:
      - .github/actions/ssh-check-hosts/**
      - tools/ssh_jump_proof.py
      - tools/run_workflow_steps.py
      - .github/workflows/ssh-jump-self.yml
  push:
    branches: [main]
    paths:
      - .github/actions/ssh-check-hosts/**
      - tools/ssh_jump_proof.py
      - tools/run_workflow_steps.py
      - .github/workflows/ssh-jump-self.yml
  schedule:
    - cron: '17 4 * * 1'

# One run per pull request: a newer push cancels the superseded run. A push,
# schedule or manual run is its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  jump-proof:
    name: Jump hop on real sshd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The servers need the sshd account and /run/sshd, which the package
      # creates. A system sshd that already listens on port 22 would stop the
      # proof's servers binding; the script names that case and stops.
      - name: Install the SSH server and stop the system one
        run: |
          set -euo pipefail
          if ! command -v sshd > /dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          for unit in ssh.socket ssh.service; do
            if systemctl is-active --quiet "$unit"; then
              sudo systemctl stop "$unit"
            fi
          done

      - name: Prove the jump path and its lock, printing each observation
        run: python3 tools/ssh_jump_proof.py
