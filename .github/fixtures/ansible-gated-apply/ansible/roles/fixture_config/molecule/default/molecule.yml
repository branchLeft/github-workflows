---
# The role's container-only test (ANS-15). The reusable workflow sets
# ROLE_TEST_RUN_ID, so the instance name is unique to one run. When the variable
# is unset the name falls back to one the Docker daemon rejects, so a run
# without the workflow fails at create instead of sharing a container name.
dependency:
  name: galaxy
  # Nothing is fetched from Galaxy: the collections come with the `ansible`
  # package in the lock, and the workflow's discover job requires this setting.
  # Molecule's prerun stays on, because it is what makes the role resolve by its
  # full name; the discover job refuses the files prerun would install from
  # Galaxy (a requirements file in the role directory, a galaxy.yml).
  enabled: false
driver:
  name: docker
platforms:
  - name: 'role-test-${ROLE_TEST_RUN_ID:-unset/use-the-workflow}'
    # Pre-built, so that the reference can carry a digest. The digest is the pin
    # and the tag beside it is only a label.
    image: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
    pre_build_image: true
    labels:
      branchleft.role-test-run: '${ROLE_TEST_RUN_ID}'
provisioner:
  name: ansible
verifier:
  name: ansible
